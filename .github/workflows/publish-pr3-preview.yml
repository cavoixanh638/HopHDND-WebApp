name: Publish independent HopHDND PR3 preview
on:
  push:
    branches: [preview/hophdnd-pr3-2026-10-16]
    paths:
      - ".github/workflows/publish-pr3-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hophdnd-pr3-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verified feature commit
        uses: actions/checkout@v4
        with:
          ref: 9f9ba803cc6d60c0101644d79ea8613d9d20a38b
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: candidate/source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: candidate/source
        run: npm ci
      - name: Run TypeScript, unit and Firebase emulator safety checks
        working-directory: candidate/source
        run: |
          npm run typecheck
          npm test
          npm run test:firebase
          npm run docs:check
      - name: Build standalone HTML
        working-directory: candidate/source
        run: npm run build:pages
      - name: Checkout main to isolate preview file
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0
          persist-credentials: true
      - name: Add visible preview banner and verify production index is untouched
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          const src='candidate/source/dist-pages/index.html';
          const dest='site/preview/current/index.html';
          const html=readFileSync(src,'utf8');
          if(!html.includes('<body>') || !html.includes('id="root"'))throw Error('Not the expected standalone Pages artifact');
          if(html.includes('Cột và khung bảng'))throw Error('Stale build: old column-frame label');
          if(!html.includes('Quản lý cột'))throw Error('Field manager UI absent');
          if(!html.includes('Quản lý cột')||!html.includes('column-manager-heading'))throw Error('Unified column settings absent');
          if(!html.includes('column-choice-editor')||!html.includes('Lưu thay đổi')||!html.includes('Cho phép sửa cột'))throw Error('Inline dropdown editing or column grants absent');
          if(!html.includes('Liên kết chuyên viên – phòng'))throw Error('Advanced assignment section missing');
          if(!html.includes('Chiều rộng trang Danh sách'))throw Error('Independent list page width control absent');
          if(!html.includes('Không lưu được cách hiển thị.'))throw Error('Save feedback is absent');
          if(!html.includes('Kéo cạnh tiêu đề trên bảng'))throw Error('Drag-to-resize hint absent');
          if(!html.includes('layout-inline-error'))throw Error('In-panel width warning missing');
          if(!html.includes('item-data-region'))throw Error('Separated table viewport missing');
          if(!html.includes('Giải quyết xung đột cách hiển thị')||!html.includes('Xác nhận lựa chọn và lưu'))throw Error('Explicit Firebase conflict resolution UI absent');
          if(!html.includes('item-column-filter-row')||!html.includes('item-sticky-search-controls'))throw Error('Sticky column search filters missing');
          if(!html.includes('preview:'))throw Error('Preview draft isolation missing');
          if(!html.includes('column-sort-button')||!html.includes('item-header-actions')||!html.includes('layout-loading-placeholder')||!html.includes('Xem dữ liệu tạm (bố cục mặc định)'))throw Error('Stable first paint or explicit fallback absent');
          if(!html.includes('guest-signin')||!html.includes('Sửa thử nội dung'))throw Error('Guest role-specific controls absent');
          if(!html.includes('Tìm kiếm cột'))throw Error('Subtle direct column search absent');
          if(!html.includes('permission-action-bar')||!html.includes('permission-switch-confirm'))throw Error('Top save controls or safe switch missing');
          if(!html.includes('Hiển thị bảng'))throw Error('New Vietnamese layout label missing');
          if(!html.includes('guest-rights-hint'))throw Error('Guest permission explanation missing');
          if(!html.includes('report-group-col')||!html.includes('Lãnh đạo VP'))throw Error('Fixed grouping column or its new title missing');
          if(!html.includes('report-flow-summary')||!html.includes('report-number-header')||!html.includes('report-focus-button')||!html.includes('Nhấn mạnh Sở chưa trình'))throw Error('Centered numeric dashboard with workflow focus controls missing');
          if(!html.includes('report-percent-col')||!html.includes('report-percent-value')||!html.includes('report-visual-options')||!html.includes('Font chữ chung cho mọi bảng')||!html.includes('report-style-classic'))throw Error('Font, completion and multi-layout dashboard controls missing');
          if(!html.includes('settings-hub-tabs')||!html.includes('options-popover')||!html.includes('Tài khoản và dữ liệu'))throw Error('Two-entry settings navigation missing');
          if(html.includes('options-group'))throw Error('Old nested settings accordion was not removed');
          if(!html.includes('Độ rộng trang Bảng báo cáo (px)'))throw Error('Separate report width control absent');
          if(!html.includes('--page-content-width'))throw Error('Independent page content width missing');
          if(!html.includes('report-page-width-controls'))throw Error('Dedicated report tab sizing CSS missing');
          if(!html.includes('Hiện tất cả'))throw Error('One-click show all source columns missing');
          if(!html.includes('source-column-visibility')||!html.includes('Theo cột đã chọn')||!html.includes('Hiện đủ cột Excel'))throw Error('Complete A-R viewer or saved column toggle missing');
          if(!html.includes('EXCEL_SOURCE_COLUMNS')&&!html.includes('Loại VB (HC/QPPL/BC)'))throw Error('Canonical 18-field Excel A-R schema missing');
          if(!html.includes('Xem lịch sử chỉnh sửa'))throw Error('Audit action no longer accessible from ID cell');
          if(!html.includes('Cấp Thành ủy cho ý kiến')||!html.includes('Tiến độ hiện tại'))throw Error('Latest Excel F/N fields missing');
          if(!html.includes('Tiến độ hiện tại'))throw Error('Correct N column name missing');
          if(!html.includes('Hiện tất cả'))throw Error('Immediate editor show-all-columns action missing');
          if(!html.includes('60961344'))throw Error('Correct workbook tab gid absent');
          if(!html.includes('Trang Excel không khớp: cột'))throw Error('Wrong-sheet and missing-source-header guard absent');
          if(!html.includes('Tiến độ xin ý kiến Thành ủy')||!html.includes('Tiến độ trình HĐND xây dựng NQ')||!html.includes('Tiến độ trình HĐND ban hành NQ/BC'))throw Error('Excel G/H/I header labels are missing');
          if(!html.includes('Cấp Thành ủy cho ý kiến')||!html.includes('Tiến độ xin ý kiến Thành ủy'))throw Error('Excel F/G mapped headers missing');
          if(!html.includes('A:O'))throw Error('Live Sheet query must request latest A–O columns');
          if(html.includes('Đã lưu Bảng báo cáo vào Firebase. Bạn có thể tiếp tục chỉnh sửa.'))throw Error('Redundant success banner still present');
          if(!html.includes('onPreviewWidthChange'))throw Error('Live width preview handler missing');
          if(!html.includes('shared-view-exit'))throw Error('One global view-mode exit is missing');
          if(!html.includes('Lưu Bảng báo cáo')||!html.includes('Lưu thay đổi')||!html.includes('column-manager-savebar'))throw Error('Single column save or separate reports save is missing');
          if(!html.includes('Cho phép sửa cột')||!html.includes('Quyền riêng theo dòng/ô'))throw Error('Column grants or legacy rights safety missing');
          if(!html.includes('Quản lý cột')||!html.includes('+ Thêm cột')||!html.includes('column-choice-add')||!html.includes('column-specialist-relations'))throw Error('Unified dropdown and advanced field manager missing');
          if(!html.includes('column-manager-detail')||!html.includes('column-manager-grid')||!html.includes('width:min(100%,760px)')||!html.includes('Thao tác'))throw Error('Adjacent compact column controls missing');
          if(!html.includes('giá trị thứ')||!html.includes('bị trùng'))throw Error('Specific catalog validation messages missing');
          if(!html.includes('Hiện tất cả')||!html.includes('Tiến độ hiện tại'))throw Error('Latest Excel A–O schema missing');
          if(!html.includes('Quyền trên Firebase đã thay đổi so với bản đang chỉnh'))throw Error('Permission CAS authoritative read fix absent');
          if(html.includes('Lưu bố trí và về chế độ xem')||html.includes('Lưu danh mục và thoát'))throw Error('Old combined save-and-exit action still exists');
          const banner='<div id="hophdnd-pr3-preview-banner" role="note" style="position:sticky;top:0;z-index:2147483646;background:#623905;color:#fff;padding:10px 16px;font:600 13px/1.5 system-ui,sans-serif;border-bottom:3px solid #f5c15a">BẢN XEM TRƯỚC PR #3 — FONT & 3 KIỂU BẢNG TỔNG QUAN CÓ TỶ LỆ HOÀN THÀNH (18/10/2026) · Theo file nguồn sửa lúc 19:07: 15 cột A–O, N=Tiến độ hiện tại, O=Ghi chú; tùy chỉnh kéo cột, xuống dòng, thêm/xóa/đổi tên, danh sách chọn và nhập tự do. Giữ Quản lý cột và một nút Lưu thay đổi; Kiểu nhập, Cho sửa, Sửa nằm sát tên cột trong nhóm 760px, không dàn trải toàn trang. Chờ bố cục đã lưu từ Firebase trước lần dựng bảng, giữ nguyên cột ẩn/thứ tự và độ rộng cá nhân; chỉ xem mặc định khi chủ động chọn. Hiện rõ phần lưu Firebase thất bại, thu gọn Quản lý cột và để bảng nội dung gần tùy chỉnh. Giữ sort và tìm kiếm ổn định; Tổng quan có font chung cho các bảng, nền cột đầu/hàng tiêu đề, % hoàn thành từng dòng và tổng, 3 mẫu báo cáo chuẩn / nhấn mạnh giai đoạn / cô đọng. Màu chỉ minh họa mức ưu tiên, không kết luận quá hạn. Chuẩn hóa giá trị dropdown có khoảng trắng, trùng hoặc quá dài từ Sheets mà không thay đổi Sheets gốc; thông báo rõ cột/mục nếu người dùng nhập lựa chọn sai. ID/STT vẫn chỉ đọc do Sheets chưa hỗ trợ ghi có kiểm tra khóa. Đường dẫn thử ổn định. Các nút Phê duyệt, Khóa sửa và Lưu cấu hình có thể ghi vào FIREBASE THẬT — chưa bấm khi chưa thống nhất kiểm thử. <a href="../../" style="color:#fff;text-decoration:underline">Về website chính</a></div>';
          mkdirSync('site/preview/current',{recursive:true});
          writeFileSync(dest,html.replace('<body>','<body>'+banner));
          if(!readFileSync(dest,'utf8').includes('PR #3 — FONT & 3 KIỂU BẢNG TỔNG QUAN CÓ TỶ LỆ HOÀN THÀNH'))throw Error('Preview banner missing');
          console.log('Built independently at '+dest+' with original production Pages index untouched');
          NODE
          git -C site diff --exit-code -- index.html
          test -s site/preview/current/index.html
      - name: Commit only preview/current/index.html to main (never alter live index.html)
        shell: bash
        run: |
          set -euo pipefail
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add -- preview/current/index.html
          changed="$(git -C site diff --cached --name-only)"
          if [ "$changed" != "preview/current/index.html" ]; then
            echo "::error::Unexpected staged paths: $changed"
            exit 1
          fi
          if git -C site diff --cached --quiet; then
            echo "Current preview already up-to-date."
            exit 0
          fi
          git -C site commit -m "preview(pages): isolated PR3 test page from verified feature source"
          for attempt in 1 2 3; do
            git -C site fetch origin main
            git -C site rebase origin/main
            if git -C site push origin HEAD:main; then
              echo "Preview deployed without modifying root index.html."
              exit 0
            fi
            echo "main advanced; retrying ($attempt/3)"
          done
          echo "::error::Could not push preview safely"
          exit 1
