name: Publish independent HopHDND PR3 preview
on:
  push:
    branches: [preview/hophdnd-pr3-2026-10-16]
    paths:
      - ".github/workflows/publish-pr3-preview.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hophdnd-pr3-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact verified feature commit
        uses: actions/checkout@v4
        with:
          ref: ab0d8d49dd640477164a947a4d5563354f4412fa
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: candidate/source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        working-directory: candidate/source
        run: npm ci
      - name: Run TypeScript, unit and Firebase emulator safety checks
        working-directory: candidate/source
        run: |
          npm run typecheck
          npm test
          npm run test:firebase
          npm run docs:check
      - name: Build standalone HTML
        working-directory: candidate/source
        run: npm run build:pages
      - name: Checkout main to isolate preview file
        uses: actions/checkout@v4
        with:
          ref: main
          path: site
          fetch-depth: 0
          persist-credentials: true
      - name: Add visible preview banner and verify production index is untouched
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          const src='candidate/source/dist-pages/index.html';
          const dest='site/preview/current/index.html';
          const html=readFileSync(src,'utf8');
          if(!html.includes('<body>') || !html.includes('id="root"'))throw Error('Not the expected standalone Pages artifact');
          if(html.includes('Cột và khung bảng'))throw Error('Stale build: old column-frame label');
          if(!html.includes('Cột và độ rộng bảng'))throw Error('Old layout UI detected');
          if(!html.includes('Độ rộng trang Danh sách dữ liệu (px)'))throw Error('Viewport input absent');
          if(!html.includes('Không lưu được cách hiển thị.'))throw Error('Save feedback is absent');
          if(!html.includes('Enter hoặc rời ô để áp dụng'))throw Error('Deferred width input hint absent');
          if(!html.includes('layout-inline-error'))throw Error('In-panel width warning missing');
          if(!html.includes('item-data-region'))throw Error('Separated table viewport missing');
          if(!html.includes('Giải quyết xung đột cách hiển thị')||!html.includes('Xác nhận lựa chọn và lưu'))throw Error('Explicit Firebase conflict resolution UI absent');
          if(!html.includes('item-column-filter-row')||!html.includes('item-sticky-search-controls'))throw Error('Sticky column search filters missing');
          if(!html.includes('preview:'))throw Error('Preview draft isolation missing');
          if(!html.includes('item-filter-status-slot')||!html.includes('scrollbar-gutter:stable'))throw Error('Stable filtering layout absent');
          if(!html.includes('guest-signin')||!html.includes('Sửa thử nội dung'))throw Error('Guest role-specific controls absent');
          if(!html.includes('Tìm kiếm cột'))throw Error('Subtle direct column search absent');
          if(!html.includes('permission-action-bar')||!html.includes('permission-switch-confirm'))throw Error('Top save controls or safe switch missing');
          if(!html.includes('Hiển thị bảng'))throw Error('New Vietnamese layout label missing');
          if(!html.includes('guest-rights-hint'))throw Error('Guest permission explanation missing');
          if(!html.includes('report-group-col')||!html.includes('Lãnh đạo VP'))throw Error('Fixed grouping column or its new title missing');
          if(!html.includes('settings-hub-tabs')||!html.includes('options-popover')||!html.includes('Tài khoản và dữ liệu'))throw Error('Two-entry settings navigation missing');
          if(html.includes('options-group'))throw Error('Old nested settings accordion was not removed');
          if(!html.includes('Độ rộng trang Bảng báo cáo (px)'))throw Error('Separate report width control absent');
          if(!html.includes('--page-content-width'))throw Error('Independent page content width missing');
          if(!html.includes('report-page-width-controls'))throw Error('Dedicated report tab sizing CSS missing');
          if(!html.includes('Hiện tất cả cột Excel'))throw Error('One-click show all source columns missing');
          if(!html.includes('source-column-visibility')||!html.includes('Theo cột đã chọn')||!html.includes('Hiện đủ cột Excel'))throw Error('Complete A-R viewer or saved column toggle missing');
          if(!html.includes('EXCEL_SOURCE_COLUMNS')&&!html.includes('Loại VB (HC/QPPL/BC)'))throw Error('Canonical 18-field Excel A-R schema missing');
          if(!html.includes('Xem lịch sử chỉnh sửa'))throw Error('Audit action no longer accessible from ID cell');
          if(!html.includes('Cấp cho ý kiến')||!html.includes('Họp Thành ủy / xin ý kiến'))throw Error('Excel F/P fields missing');
          if(!html.includes('Tiến độ xin ý kiến Thành ủy')||!html.includes('Tiến độ trình HĐND xây dựng NQ')||!html.includes('Tiến độ trình HĐND ban hành NQ/BC'))throw Error('Excel G/H/I header labels are missing');
          if(!html.includes('partyMeeting')||!html.includes('examined')||!html.includes('Họp Thành ủy / xin ý kiến'))throw Error('Excel P/Q mapping absent');
          if(!html.includes('A:R'))throw Error('Live Sheet query must request all 18 columns');
          if(html.includes('Đã lưu Bảng báo cáo vào Firebase. Bạn có thể tiếp tục chỉnh sửa.'))throw Error('Redundant success banner still present');
          if(!html.includes('onPreviewWidthChange'))throw Error('Live width preview handler missing');
          if(!html.includes('shared-view-exit'))throw Error('One global view-mode exit is missing');
          if(!html.includes('Lưu Bảng báo cáo')||!html.includes('Lưu Danh mục'))throw Error('Separate save actions are missing');
          if(!html.includes('Lưu quyền chỉnh sửa'))throw Error('Independent permissions save action missing');
          if(html.includes('Lưu bố trí và về chế độ xem')||html.includes('Lưu danh mục và thoát'))throw Error('Old combined save-and-exit action still exists');
          const banner='<div id="hophdnd-pr3-preview-banner" role="note" style="position:sticky;top:0;z-index:2147483646;background:#623905;color:#fff;padding:10px 16px;font:600 13px/1.5 system-ui,sans-serif;border-bottom:3px solid #f5c15a">BẢN XEM TRƯỚC PR #3 — KHỚP 18 CỘT A–R (17/10/2026) · Bỏ cột Lịch sử khỏi cấu hình bảng, cột O là Rút, đặt đúng tên/thứ tự cột Excel. Lịch sử là thao tác tại ô ID. Đường dẫn thử ổn định. Các nút Phê duyệt, Khóa sửa và Lưu cấu hình có thể ghi vào FIREBASE THẬT — chưa bấm khi chưa thống nhất kiểm thử. <a href="../../" style="color:#fff;text-decoration:underline">Về website chính</a></div>';
          mkdirSync('site/preview/current',{recursive:true});
          writeFileSync(dest,html.replace('<body>','<body>'+banner));
          if(!readFileSync(dest,'utf8').includes('PR #3 — KHỚP 18 CỘT A–R'))throw Error('Preview banner missing');
          console.log('Built independently at '+dest+' with original production Pages index untouched');
          NODE
          git -C site diff --exit-code -- index.html
          test -s site/preview/current/index.html
      - name: Commit only preview/current/index.html to main (never alter live index.html)
        shell: bash
        run: |
          set -euo pipefail
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site add -- preview/current/index.html
          changed="$(git -C site diff --cached --name-only)"
          if [ "$changed" != "preview/current/index.html" ]; then
            echo "::error::Unexpected staged paths: $changed"
            exit 1
          fi
          if git -C site diff --cached --quiet; then
            echo "Current preview already up-to-date."
            exit 0
          fi
          git -C site commit -m "preview(pages): isolated PR3 test page from verified feature source"
          for attempt in 1 2 3; do
            git -C site fetch origin main
            git -C site rebase origin/main
            if git -C site push origin HEAD:main; then
              echo "Preview deployed without modifying root index.html."
              exit 0
            fi
            echo "main advanced; retrying ($attempt/3)"
          done
          echo "::error::Could not push preview safely"
          exit 1
