name: Publish verified HopHDND UX preview
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-pr3-preview.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: hophdnd-five-style-preview
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      # Immutable passing PR run. Never build or deploy a moving PR tip.
      - uses: actions/download-artifact@v4
        with:
          name: hophdnd-pages-candidate
          run-id: 39194775971
          repository: cavoixanh638/HopHDND-WebApp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _verified_preview
      - name: Verify exact CI provenance and all requested UI behaviors
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/cavoixanh638/HopHDND-WebApp'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],
                   'Accept':'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers)) as response:
                  return json.load(response)
          run=get('/actions/runs/39194775971')
          expected='8e3e78fdd1eb0b4060cc1e4091d820e4d46b5970'
          assert run['head_sha']==expected and run['conclusion']=='success', 'Unverified PR commit'
          assert run['name']=='Verify HopHDND source', 'Unexpected verification workflow'
          artifacts=get('/actions/runs/39194775971/artifacts')['artifacts']
          html=next(a for a in artifacts if a['name']=='hophdnd-pages-candidate')
          assert not html['expired'] and html['digest']=='sha256:6782ddfd16f4fe95dd83bf622ebc4a7d1ede5d1ff68ffeb53df90dea88040174', 'Unexpected artifact'
          assert html['workflow_run']['head_sha']==expected, 'Artifact provenance mismatch'
          print('Verified immutable source SHA',expected,'artifact ID',html['id'])
          PY
          test -s _verified_preview/index.html
          for needle in "Không phải trình" "Tổng số nội dung" "Tiến độ trình HĐND xây dựng NQ" "column-resizer" "column-sort-button" "report-detail-modal" "count-drill" "report-instant-count-tooltip" "Bấm để xem"; do
            grep -Fq -- "$needle" _verified_preview/index.html
          done
          sha256sum _verified_preview/index.html
      - name: Publish only isolated preview URLs (leave production root unchanged)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview/current preview/ux-fixes-2026-10-19 preview/instant-hover-2026-10-19
          cp _verified_preview/index.html preview/current/index.html
          cp _verified_preview/index.html preview/ux-fixes-2026-10-19/index.html
          cp _verified_preview/index.html preview/instant-hover-2026-10-19/index.html
          if git diff --quiet -- preview/current/index.html preview/ux-fixes-2026-10-19/index.html preview/instant-hover-2026-10-19/index.html; then
            echo "Verified previews already match"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/current/index.html preview/ux-fixes-2026-10-19/index.html preview/instant-hover-2026-10-19/index.html
          git commit -m "preview(pages): publish verified muted NQ and immediate count hover"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published only preview/current and immutable UX preview. Root index.html untouched."
              exit 0
            fi
          done
          echo "::error::Preview publish push failed"
          exit 1
