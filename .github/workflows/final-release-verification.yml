name: FINAL ACCEPTANCE AFTER FRV-02 - independent exact SHA Auth Functions RTDB artifact (NO PROD)
on:
  push:
    branches:
      - review/pr147-final-release-verification-20261101
permissions:
  contents: read
  actions: read
jobs:
  independent-candidate-verification:
    if: ${{ startsWith(github.event.head_commit.message, 'verify-FRV-acceptance-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FINAL_VERIFY_TARGET_SHA: a355fccfb2aaab033bdcd9defe45ec89d43087ab
      GCLOUD_PROJECT: demo-hdnd
      PARENT_DATABASE_URL: https://demo-hdnd.firebaseio.com
      FIREBASE_DATABASE_URL: https://demo-hdnd.firebaseio.com
      PARENT_COMMIT_ENABLED: 'true'
      PARENT_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174
    steps:
      - name: Checkout reviewer tests with no saved credential
        uses: actions/checkout@v4
        with:
          path: reviewer
          persist-credentials: false
      - name: Pin immutable PR147 candidate in SEPARATE checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.FINAL_VERIFY_TARGET_SHA }}
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Assert immutable checkout and demo-only Emulator destination
        shell: bash
        run: |
          set -euo pipefail
          test "$(cd target && git rev-parse HEAD)" = "$FINAL_VERIFY_TARGET_SHA"
          test "$GCLOUD_PROJECT" = "demo-hdnd"
          test "$PARENT_DATABASE_URL" = "https://demo-hdnd.firebaseio.com"
          echo "FINAL_ACCEPTANCE_PINNED_SOURCE_SHA=$FINAL_VERIFY_TARGET_SHA"
      - name: npm ci root and both exact Node22 backend lockfiles
        working-directory: target/source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --prefix cell-edit-service --no-audit --no-fund
          npm ci --prefix parent-commit-service --no-audit --no-fund
          node --check parent-commit-service/src/commit.mjs
          node --check parent-commit-service/src/parent-contract.mjs
      - name: Independent offline default-deploy prevention and release config
        working-directory: target/source
        run: |
          set -euo pipefail
          mkdir -p parent-commit-service/evidence
          node scripts/pr147-default-deploy-guard.mjs 2>&1 | tee parent-commit-service/evidence/default-guard.log
          test ! -e firebase/REQUIRED_UNVERIFIED_NO_DEFAULT_DEPLOY_DO_NOT_CREATE.rules.json
          node -e "const d=require('./firebase.json');const r=require('./firebase.release.json');if(!d.database.rules.includes('REQUIRED_UNVERIFIED_NO_DEFAULT_DEPLOY_DO_NOT_CREATE')||d.functions||r.functions?.length!==2||r.database.rules!=='firebase/database.exclusive-candidate.rules.json'||r.database.instance!=='REQUIRED_UNVERIFIED')process.exit(7);console.log('FINAL_ACCEPTANCE_OFFLINE_DEFAULT_FAIL_CLOSED_PASS')"
      - name: Prepare independent QA-only append tests in detached checkout
        working-directory: target/source
        run: |
          set -euo pipefail
          node ../../reviewer/source/release-review/prepare-frv02-acceptance.mjs ../../reviewer/source/release-review/frv02-operator-negative-suffix.ts
          test -s parent-commit-service/test/frv02-acceptance.generated.test.ts
          test -s parent-commit-service/test/frv02-acceptance-run.generated.mjs
      - name: Actual Google Auth + TWO Functions + FULL RTDB Rules and real Excel operator executable
        working-directory: target/source
        shell: bash
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-hdnd --only auth,database,functions \
            --config firebase.staging.json \
            "node parent-commit-service/test/frv02-acceptance-run.generated.mjs" \
            2>&1 | tee parent-commit-service/evidence/frv02-acceptance.stdout.log
      - name: Download and independently verify current SHA immutable CI artifact INCLUDING operator tool
        if: always()
        working-directory: target/source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_VERIFY_TARGET_SHA"
          gh run download 41379790777 --repo "$GITHUB_REPOSITORY" \
            --name pr147-release-rehearsal-a355fccfb2aaab033bdcd9defe45ec89d43087ab-1 \
            --dir ../frv-artifact
          node ../../reviewer/source/release-review/verify-package-ci.mjs ../frv-artifact \
            2>&1 | tee parent-commit-service/evidence/frv02-package-audit.stdout.log
      - name: Archive redacted independent QA witness and package comparison (no tokens)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frv02-independent-acceptance-${{ github.run_id }}
          path: |
            target/source/parent-commit-service/evidence/*.json
            target/source/parent-commit-service/evidence/*.log
            target/source/parent-commit-service/test/frv02-acceptance.generated.test.ts
            target/source/parent-commit-service/test/frv02-acceptance-run.generated.mjs
          if-no-files-found: warn
          retention-days: 21
