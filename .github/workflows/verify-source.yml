name: Verify HopHDND source
on:
  pull_request:
    paths:
      - "source/**"
      - ".github/workflows/verify-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Codex review 008 exact R02 1600px boundary reproduction
        run: npm exec -- vitest run tests/pr90-review-boundary.test.ts
      - name: Validate production BACKUP READ-ONLY helper offline (no Firebase credentials)
        run: |
          node --check scripts/firebase-production-readonly-backup.mjs
          node --check scripts/firebase-backup-verify.mjs
          node --check scripts/firebase-backup-emulator-restore.mjs
          node --check scripts/firebase-private-rules-compare.mjs
          node --check scripts/firebase-verify-published-rules.mjs
          node scripts/firebase-verify-published-rules.mjs --self-test
          if node scripts/firebase-verify-published-rules.mjs; then
            echo "::error::Live Rules provenance helper must reject missing private file and may not contact production in CI."
            exit 1
          fi
          node --test scripts/firebase-private-rules-compare.fixture.mjs
          if node scripts/firebase-backup-emulator-restore.mjs; then
            echo "::error::Restore drill must reject execution without the isolated local demo emulator."
            exit 1
          fi
          node --test scripts/firebase-backup-verify.fixture.mjs
          node scripts/firebase-production-readonly-backup.mjs --help
          if node scripts/firebase-production-readonly-backup.mjs --project invalid --instance invalid --rules-file /tmp/none --output-dir /tmp/forbidden; then
            echo "::error::Production backup must reject wrong project and instance."
            exit 1
          fi
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Demonstrate isolated RTDB backup restore (synthetic data only)
        run: |
          printf '%s\n' '{"hdnd":{"items":{"demo-1":{"recordId":"demo-1","note":"synthetic-only"}},"profile":{"dataSource":"primary"},"permissions":{"columns":{"note":true}}}}' > "$RUNNER_TEMP/hophdnd-demo-restore.json"
          HDND_PRIVATE_BACKUP="$RUNNER_TEMP/hophdnd-demo-restore.json" npx firebase emulators:exec --project demo-hdnd-restore --only database --config scripts/restore-emulator/firebase.json "node scripts/firebase-backup-emulator-restore.mjs"
      - name: Documentation checks
        run: npm run docs:check
      - name: Firebase emulator tests
        run: npm run test:firebase
      - name: Build split, on-demand Pages artifact
        run: npm run build:pages
      - name: Verify split Pages artifact
        run: |
          test -s dist-pages/index.html
          test -n "$(find dist-pages/assets -type f -name '*.js' -print -quit)"
          node scripts/check-pages-performance.mjs dist-pages
      - name: Verify cached HTML asset compatibility hotfix
        run: |
          node --check scripts/check-published-assets.mjs
          node scripts/check-published-assets.mjs dist-pages/index.html dist-pages/index.html dist-pages/assets
      - name: Stage identical candidate hosting bundles without deploying
        run: node scripts/prepare-hosting-staging.mjs
      - name: Preserve verified hosting bundles (NO deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hophdnd-verified-hosting-candidates
          path: source/dist-hosting/
          if-no-files-found: error
          retention-days: 14
      - name: Verify browser benchmark command
        run: |
          node --check scripts/measure-web-startup.mjs
          node scripts/measure-web-startup.mjs --help
      - name: Verify legacy single-file offline build remains available
        run: npm run build
      - name: Verify standalone offline HTML
        run: |
          test -s dist/Dashboard_HĐND.html
          test "$(find dist -type f | wc -l)" -eq 1
      - name: Build Pages test artifact (isolated Firebase emulator configuration)
        run: npm run build:pages:test
      - name: Build isolated real ItemList visual QA (no Firebase credentials)
        run: npm run build:compact:qa
      - name: Measure historical W0 on exact pre-UI-V2 restore (synthetic fixture, no deploy)
        shell: bash
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/ui-columns-pre-ui-v2"
          git fetch --no-tags --depth=1 origin 8172c0650580931140fc71e59d3cc4d816879594
          git worktree add --detach "$base" 8172c0650580931140fc71e59d3cc4d816879594
          (cd "$base/source" && npm ci --no-audit --no-fund && npm run build:compact:qa)
          node scripts/measure-baseline-id-browser.mjs "$base/source/dist-compact-qa" hophdnd-id-before-real.png
      - name: Browser smoke with Firebase Emulator and headless Chrome
        run: node scripts/smoke-pages-browser.mjs
      - name: Package owner-clickable single HTML UI preview (synthetic only)
        run: node scripts/package-compact-qa.mjs
      - name: Upload standalone UI preview — download and double-click, no server needed
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hophdnd-compact-interactive-offline
          path: source/dist-compact-qa/HopHDND_GopCot_XemThu.html
          if-no-files-found: error
          retention-days: 14
      - name: Preserve browser smoke screenshot (synthetic data only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hophdnd-browser-smoke-preview
          path: |
            source/hophdnd-ui-smoke-pass.png
            source/hophdnd-compact-desktop-pass.png
            source/hophdnd-compact-mobile-pass.png
            source/hophdnd-compact-tablet-pass.png
            source/hophdnd-compact-guest-pass.png
            source/hophdnd-id-before-real.png
            source/hophdnd-id-before-simulated.png
            source/hophdnd-id-after.png
            source/hophdnd-id-r04-before-23-simulated.png
            source/hophdnd-id-r04-after-52px.png
            source/hophdnd-review-r01-after.png
            source/hophdnd-review-r02-after.png
            source/hophdnd-review-r02-cap-after.png
            source/hophdnd-review-r03-after.png
            source/hophdnd-r05-before-white-simulated.png
            source/hophdnd-v3-l2-clear-list.png
            source/hophdnd-v3-l2-clear-popup.png
            source/hophdnd-v3-l2-granted-desktop.png
            source/hophdnd-v3-l2-choices-only-dropdown.png
            source/hophdnd-r05-after-multitone-list.png
            source/hophdnd-r05-after-list-stage-crop.png
            source/hophdnd-r05-after-multitone-popup.png
            source/hophdnd-r05-after-popup-stage-crop.png
            source/hophdnd-r05-after-768px.png
            source/hophdnd-r05-after-390px.png
            source/hophdnd-pr95-nav-compact-synthetic.png
            source/hophdnd-pr95-list-compact-synthetic.png
            source/hophdnd-l018-four-cards-desktop.png
            source/hophdnd-summary-filter-selected-desktop.png
            source/hophdnd-summary-filter-selected-mobile-390.png
            source/hophdnd-l018-group-titles-popup.png
            source/hophdnd-l018-four-cards-mobile.png
            source/hophdnd-l019-adjacent-exhausted-fallback.png
            source/hophdnd-l019-progress-staff-before.png
            source/hophdnd-l019-progress-staff-after.png
            source/hophdnd-r06-mobile-app-shell-top.png
            source/hophdnd-r06-mobile-app-shell-table-reachable.png
            source/hophdnd-r07-popup-empty-save-fallback.png
          if-no-files-found: error
          retention-days: 7
      - name: Preserve browser smoke screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hophdnd-browser-smoke-failure
          path: source/hophdnd-ui-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 7
