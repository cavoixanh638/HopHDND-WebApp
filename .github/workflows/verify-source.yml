name: Verify HopHDND source
on:
  pull_request:
    paths:
      - "source/**"
      - ".github/workflows/verify-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install exact dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Validate production BACKUP READ-ONLY helper offline (no Firebase credentials)
        run: |
          node --check scripts/firebase-production-readonly-backup.mjs
          node --check scripts/firebase-backup-verify.mjs
          node --test scripts/firebase-backup-verify.fixture.mjs
          node scripts/firebase-production-readonly-backup.mjs --help
          if node scripts/firebase-production-readonly-backup.mjs --project invalid --instance invalid --rules-file /tmp/none --output-dir /tmp/forbidden; then
            echo "::error::Production backup must reject wrong project and instance."
            exit 1
          fi
      - name: Validate Cloud Shell bootstrap script syntax
        run: bash -n mirror_sync/bootstrap_cloud_shell.sh
      - name: Validate server mirror Python and isolated fixture
        run: |
          python3 -m venv /tmp/hophdnd-mirror-test
          /tmp/hophdnd-mirror-test/bin/pip install -r mirror_sync/requirements.txt
          /tmp/hophdnd-mirror-test/bin/python -m unittest discover -s mirror_sync -p 'test_*.py'
          /tmp/hophdnd-mirror-test/bin/python -m py_compile mirror_sync/sync.py
      - name: Documentation checks
        run: npm run docs:check
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Firebase emulator tests
        run: npm run test:firebase
      - name: Probe source GViz endpoint (read-only, diagnostic)
        run: node scripts/probe-gviz.mjs
      - name: Build split, on-demand Pages artifact
        run: npm run build:pages
      - name: Verify split Pages artifact
        run: |
          test -s dist-pages/index.html
          test -n "$(find dist-pages/assets -type f -name '*.js' -print -quit)"
          node scripts/check-pages-performance.mjs dist-pages
      - name: Verify cached HTML asset compatibility hotfix
        run: |
          node --check scripts/check-published-assets.mjs
          node scripts/check-published-assets.mjs dist-pages/index.html dist-pages/index.html dist-pages/assets
      - name: Stage identical candidate hosting bundles without deploying
        run: node scripts/prepare-hosting-staging.mjs
      - name: Verify browser benchmark command
        run: |
          node --check scripts/measure-web-startup.mjs
          node scripts/measure-web-startup.mjs --help
      - name: Verify legacy single-file offline build remains available
        run: npm run build
      - name: Verify standalone offline HTML
        run: |
          test -s dist/Dashboard_HĐND.html
          test "$(find dist -type f | wc -l)" -eq 1
      - name: Build Pages test artifact (isolated Firebase emulator configuration)
        run: npm run build:pages:test
      - name: Browser smoke with mock Sheets and headless Chrome
        run: node scripts/smoke-pages-browser.mjs
      - name: Preserve browser smoke screenshot (synthetic data only)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: hophdnd-browser-smoke-preview
          path: source/hophdnd-ui-smoke-pass.png
          if-no-files-found: error
          retention-days: 7
      - name: Preserve browser smoke screenshot on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hophdnd-browser-smoke-failure
          path: source/hophdnd-ui-smoke-failure.png
          if-no-files-found: ignore
          retention-days: 7
