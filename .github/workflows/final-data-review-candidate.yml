name: FINAL-DATA-REVIEW (real PR147 parent-cell concurrent commits)
on:
  push:
    branches:
      - review/pr142-final-data-crosscheck-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-candidate-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with: {path: reviewer, persist-credentials: false}
      - name: Pin candidate PR147 runtime exact SHA (do not mutate candidate branch)
        uses: actions/checkout@v4
        with:
          ref: ba8e20120e412fd3ef213cd5bf19832ccfbb3339
          path: candidate-target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install candidate app + independent services without touching lockfile
        working-directory: candidate-target/source
        run: |
          test "$(git rev-parse HEAD)" = "ba8e20120e412fd3ef213cd5bf19832ccfbb3339"
          npm ci
          npm install --prefix parent-commit-service --no-package-lock --ignore-scripts
          npm install --prefix cell-edit-service --no-package-lock --ignore-scripts
          node ../../reviewer/source/data-review/prepare-candidate-races.mjs
          test -s parent-commit-service/test/final-data-candidate.generated.test.ts
          mkdir -p parent-commit-service/evidence
      - name: Real signed-in parent commit interleaved with actual cell transactions on PR147 FULL Rules
        working-directory: candidate-target/source
        shell: bash
        env:
          PARENT_COMMIT_ENABLED: 'true'
          PARENT_DATABASE_URL: https://demo-hdnd.firebaseio.com
          PARENT_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-hdnd --only auth,database,functions \
            --config firebase.staging.json \
            "node parent-commit-service/test/final-data-candidate-run.generated.mjs" 2>&1 \
            | tee parent-commit-service/evidence/final-data-review-candidate.stdout.log
      - name: Upload deterministic before/after and source witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-data-review-candidate-${{ github.run_id }}
          path: |
            candidate-target/source/parent-commit-service/evidence/**
            candidate-target/source/parent-commit-service/test/final-data-candidate.generated.test.ts
          if-no-files-found: warn
          retention-days: 30
