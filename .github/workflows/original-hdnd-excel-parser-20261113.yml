name: HĐND original Excel A-O compatibility test (NO DEPLOY)
on:
  push:
    branches: ["fix/20261113-native-hdnd-excel-import"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  original-excel-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
      - name: Validate TypeScript
        run: npm run typecheck
      - name: Validate synthetic original source workbook and strict template contracts
        run: npx vitest run tests/business-excel-original-hdnd.test.ts tests/business-excel.test.ts
      - name: Validate Spark public build
        run: npm run build:spark
