name: Build and publish HopHDND Pages
on:
  push:
    branches: [main]
    paths:
      - "source/src/**"
      - "source/shared/**"
      - "source/scripts/**"
      - "source/pages.html"
      - "source/index.html"
      - "source/vite.config.ts"
      - "source/tsconfig.json"
      - "source/package.json"
      - "source/package-lock.json"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: write

concurrency:
  group: hophdnd-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Firebase emulator tests
        run: npm run test:firebase
      - name: Check documentation
        run: npm run docs:check
      - name: Build Pages from TypeScript
        run: npm run build:pages
      - name: Copy split, content-hashed Pages assets to the GitHub Pages root
        run: |
          cp dist-pages/index.html ../index.html
          mkdir -p ../assets
          rsync -a --delete dist-pages/assets/ ../assets/
          test -s ../index.html
          test -n "$(find ../assets -type f -name '*.js' -print -quit)"
      - name: Commit and push Pages HTML and assets if changed
        working-directory: .
        shell: bash
        run: |
          git add -A -- index.html assets
          if git diff --cached --quiet -- index.html assets; then
            echo "Published HTML already matches the source build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(pages): publish verified split HopHDND source"
          # Documentation-only pushes can advance main while CI is building.
          # Rebase the HTML-only commit, never overwrite a newer source revision.
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet HEAD origin/main -- source/src source/shared source/scripts source/pages.html source/index.html source/vite.config.ts source/tsconfig.json source/package.json source/package-lock.json; then
              echo "::error::Source changed during build. A newer source push must be built separately."
              exit 1
            fi
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Pages HTML published after rechecking main."
              exit 0
            fi
            echo "main advanced during publish; retrying ($attempt/3)."
          done
          echo "::error::Could not publish after three non-force push attempts."
          exit 1
