name: Build and publish HopHDND Pages
on:
  push:
    branches: [main]
    paths:
      - "source/**"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: write

concurrency:
  group: hophdnd-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Firebase emulator tests
        run: npm run test:firebase
      - name: Check documentation
        run: npm run docs:check
      - name: Build Pages from TypeScript
        run: npm run build:pages
      - name: Copy verified artifact to GitHub Pages root
        run: cp dist-pages/index.html ../index.html
      - name: Commit and push Pages HTML if changed
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Published HTML already matches the source build."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "build(pages): publish verified HopHDND source"
          git push origin HEAD:main
