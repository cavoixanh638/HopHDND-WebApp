name: Build and publish HopHDND Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".nojekyll"
      - "source/src/**"
      - "source/shared/**"
      - "source/scripts/**"
      - "source/pages.html"
      - "source/index.html"
      - "source/vite.config.ts"
      - "source/tsconfig.json"
      - "source/package.json"
      - "source/package-lock.json"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: write

concurrency:
  group: hophdnd-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    # Fail closed until the ONE-TIME Spark RTDB security/data cutover is
    # independently verified and the exact main source SHA is approved.
    # Never use the historic Functions approval in a no-billing Spark release.
    if: ${{ github.ref == 'refs/heads/main' && vars.HOPHDND_SPARK_PRODUCTION_CONFIRMED == 'true' && vars.HOPHDND_PAGES_APPROVED_MAIN_SHA == github.sha }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Install locked local parent-operator dependencies for Spark Emulator tests
        run: npm ci --prefix parent-commit-service --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Firebase Spark Auth/RTDB Emulator tests (no Cloud Functions)
        run: npm run test:spark
      - name: Check documentation
        run: npm run docs:check
      - name: Build the Spark PUBLIC Pages client only (never the local operator)
        env:
          VITE_PARENT_REPLACEMENT_ENABLED: 'false'
          VITE_PARENT_COMMIT_ENDPOINT: ''
        run: npm run build:spark
      - name: Verify publishable Spark bundle without localhost operator endpoint
        run: |
          test -s dist-spark/index.html
          test -d dist-spark/assets
          if grep -R -E 'http://127[.]0[.]0[.]1:8787/parentDatasetCommit|http://localhost:8787/parentDatasetCommit' dist-spark/assets; then
            echo "::error::SPARK_PAGES_HOLD: local operator endpoint leaked into PUBLIC build"
            exit 1
          fi
          echo "SPARK_PUBLIC_BUNDLE_PASS"
      - name: Copy split Pages build while keeping older hashed assets for cached HTML
        run: |
          # GitHub Pages/browser/CDN may still serve the previous index.html.
          # Deleting its hashed JS breaks the entire app before Firebase can start.
          # Keep previously published hashed assets, never replace the data/rules.
          cp ../index.html /tmp/hophdnd-previous-index.html
          cp dist-spark/index.html ../index.html
          mkdir -p ../assets
          rsync -a dist-spark/assets/ ../assets/
          printf '{"mode":"spark","source_sha":"%s"}\n' "$GITHUB_SHA" > ../version.json
          test -s ../index.html
          test -f ../.nojekyll || { echo "::error::Missing .nojekyll; GitHub Pages Jekyll will parse TypeScript documentation and fail."; exit 1; }
          echo "PAGES_JEKYLL_DISABLED_PASS"
          test -n "$(find ../assets -type f -name '*.js' -print -quit)"
          node scripts/check-published-assets.mjs ../index.html /tmp/hophdnd-previous-index.html ../assets
      - name: Commit and push only if main still matches approved exact SHA
        working-directory: .
        shell: bash
        env:
          APPROVED_MAIN_SHA: ${{ vars.HOPHDND_PAGES_APPROVED_MAIN_SHA }}
          SPARK_PRODUCTION_CONFIRMED: ${{ vars.HOPHDND_SPARK_PRODUCTION_CONFIRMED }}
        run: |
          set -euo pipefail
          # An approval is bound to one exact main commit, not merely a source tree.
          if [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$APPROVED_MAIN_SHA" != "$GITHUB_SHA" ] ||
             [ "$SPARK_PRODUCTION_CONFIRMED" != "true" ]; then
            echo "::error::PAGES_RELEASE_HOLD: main ref or approval does not match job SHA"
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ] ||
             [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::PAGES_RELEASE_HOLD: main advanced; new SHA requires new approval"
            exit 1
          fi
          git add -A -- index.html assets version.json
          if git diff --cached --quiet -- index.html assets version.json; then
            echo "Pages assets already match exactly approved main SHA; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(pages): publish verified Spark WebApp from approved source"
          # Race-safe: no rebase onto newer main, even if only docs changed.
          # If main advances after this fetch, non-force push will fail closed.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::PAGES_RELEASE_HOLD: main advanced before push; re-approve new SHA"
            exit 1
          fi
          if ! git push origin HEAD:main; then
            echo "::error::PAGES_RELEASE_HOLD: non-force push rejected; do not retry on newer main"
            exit 1
          fi
          echo "Pages published from exact approved main SHA."
