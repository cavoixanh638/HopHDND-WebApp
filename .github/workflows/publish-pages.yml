name: Build and publish HopHDND Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".nojekyll"
      - "source/src/**"
      - "source/shared/**"
      - "source/scripts/**"
      - "source/pages.html"
      - "source/index.html"
      - "source/vite.config.ts"
      - "source/tsconfig.json"
      - "source/package.json"
      - "source/package-lock.json"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: write

concurrency:
  group: hophdnd-pages-publish
  cancel-in-progress: false

jobs:
  release-gate:
    # UI-only source changes auto-publish after validation. Guarded changes
    # require an explicit Run workflow click by the repository owner, scoped
    # ONLY to the selected main SHA. The legacy variable is optional.
    # Never deploy Firebase Rules or touch database data here.
    if: ${{ github.ref == 'refs/heads/main' && vars.HOPHDND_SPARK_PRODUCTION_CONFIRMED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_allowed: ${{ steps.policy.outputs.release_allowed }}
      policy_mode: ${{ steps.policy.outputs.policy_mode }}
      baseline_sha: ${{ steps.policy.outputs.baseline_sha }}
      approved_main_sha: ${{ steps.approval.outputs.approved_main_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Verify UI-only and owner-dispatch release guards (NO DEPLOY)
        run: |
          node --test source/scripts/pages-release-policy.check.mjs
          node --test source/scripts/pages-release-approval.check.mjs
      - name: Resolve owner-only manual approval for this run (no variable edits)
        id: approval
        env:
          LEGACY_APPROVED_MAIN_SHA: ${{ vars.HOPHDND_PAGES_APPROVED_MAIN_SHA }}
        run: node source/scripts/pages-release-approval.mjs
      - name: Classify every unpublished commit (fail closed)
        id: policy
        env:
          APPROVED_MAIN_SHA: ${{ steps.approval.outputs.approved_main_sha }}
        run: |
          node source/scripts/pages-release-policy.mjs --head "$GITHUB_SHA" --approved "$APPROVED_MAIN_SHA"
  publish:
    needs: release-gate
    if: ${{ needs.release-gate.outputs.release_allowed == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          # No persistent write token while npm scripts / browser QA execute.
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Install locked local parent-operator dependencies for Spark Emulator tests
        run: npm ci --prefix parent-commit-service --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      # Auto UI releases must pass the same real Chrome dropdown interaction
      # checks as PR QA, not just a TypeScript/CSS build.
      - name: Real Chromium UI smoke, layout draft Save/Cancel and dropdown QA (synthetic)
        run: |
          npm run build:compact:qa
          node scripts/smoke-pages-browser.mjs
          node scripts/pr95-v5-l1-dropdown-browser.mjs
      - name: Firebase Spark Auth/RTDB Emulator tests (no Cloud Functions)
        run: npm run test:spark
      - name: Check documentation
        run: npm run docs:check
      - name: Confirm direct-status-CAS release gate (NO Rules deploy)
        id: status_cas
        env:
          CONFIRMED: ${{ vars.HOPHDND_STATUS_CAS_PRODUCTION_CONFIRMED }}
          APPROVED_RULES_SHA256: ${{ vars.HOPHDND_STATUS_CAS_APPROVED_RULES_SHA256 }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMED" = 'true' ]; then
            test -n "$APPROVED_RULES_SHA256" || { echo "::error::STATUS_CAS_HOLD: missing approved Rules SHA256"; exit 1; }
            local_sha="$(sha256sum firebase/database.spark.rules.json | cut -d' ' -f1)"
            test "$local_sha" = "$APPROVED_RULES_SHA256" || { echo "::error::STATUS_CAS_HOLD: candidate Rules SHA mismatch"; exit 1; }
            echo "status_cas=true" >> "$GITHUB_OUTPUT"
            echo "Direct-CAS was separately verified/deployed; candidate Rules exact SHA approved."
          else
            echo "status_cas=false" >> "$GITHUB_OUTPUT"
            echo "Direct-CAS disabled; keep existing exclusive-cell-lease release."
          fi
      - name: Verify exact generated Rules (when direct status CAS is activated)
        if: steps.status_cas.outputs.status_cas == 'true'
        run: |
          npm run rules:spark
          git diff --exit-code -- firebase/database.spark.rules.json
      - name: Auth/RTDB security acceptance before enabled direct status build
        if: steps.status_cas.outputs.status_cas == 'true'
        env:
          VITE_FIREBASE_WRITE_MODE: spark
          VITE_FIREBASE_STATUS_CAS: 'true'
        run: npx firebase emulators:exec --project demo-hdnd --config firebase.spark-test.json --only auth,database "node node_modules/vitest/vitest.mjs run tests/spark-direct-status-cas.test.ts tests/pr190-independent-security.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism"
      - name: Build the Spark PUBLIC Pages client only (never the local operator)
        env:
          VITE_PARENT_REPLACEMENT_ENABLED: 'false'
          VITE_PARENT_COMMIT_ENDPOINT: ''
          VITE_FIREBASE_STATUS_CAS: ${{ steps.status_cas.outputs.status_cas }}
        run: npm run build:spark
      - name: Verify publishable Spark bundle without localhost operator endpoint
        run: |
          test -s dist-spark/index.html
          test -d dist-spark/assets
          if grep -R -E 'http://127[.]0[.]0[.]1:8787/parentDatasetCommit|http://localhost:8787/parentDatasetCommit' dist-spark/assets; then
            echo "::error::SPARK_PAGES_HOLD: local operator endpoint leaked into PUBLIC build"
            exit 1
          fi
          echo "SPARK_PUBLIC_BUNDLE_PASS"
      - name: Copy split Pages build while keeping older hashed assets for cached HTML
        run: |
          # GitHub Pages/browser/CDN may still serve the previous index.html.
          # Deleting its hashed JS breaks the entire app before Firebase can start.
          # Keep previously published hashed assets, never replace the data/rules.
          cp ../index.html /tmp/hophdnd-previous-index.html
          cp dist-spark/index.html ../index.html
          mkdir -p ../assets
          rsync -a dist-spark/assets/ ../assets/
          printf '{"mode":"spark","source_sha":"%s","status_cas":%s}\n' "$GITHUB_SHA" '${{ steps.status_cas.outputs.status_cas }}' > ../version.json
          test -s ../index.html
          test -f ../.nojekyll || { echo "::error::Missing .nojekyll; GitHub Pages Jekyll will parse TypeScript documentation and fail."; exit 1; }
          echo "PAGES_JEKYLL_DISABLED_PASS"
          test -n "$(find ../assets -type f -name '*.js' -print -quit)"
          node scripts/check-published-assets.mjs ../index.html /tmp/hophdnd-previous-index.html ../assets
      - name: Commit and push only if main still matches verified source
        working-directory: .
        shell: bash
        env:
          APPROVED_MAIN_SHA: ${{ needs.release-gate.outputs.approved_main_sha }}
          SPARK_PRODUCTION_CONFIRMED: ${{ vars.HOPHDND_SPARK_PRODUCTION_CONFIRMED }}
          RELEASE_MODE: ${{ needs.release-gate.outputs.policy_mode }}
          RELEASE_BASELINE: ${{ needs.release-gate.outputs.baseline_sha }}
          # Write token is provided ONLY to this final, guarded push step.
          RELEASE_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$SPARK_PRODUCTION_CONFIRMED" != "true" ] ||
             [ -z "$RELEASE_BASELINE" ]; then
            echo "::error::PAGES_RELEASE_HOLD: wrong ref, Spark not confirmed, or release baseline missing"
            exit 1
          fi
          if [ "$RELEASE_MODE" != "auto" ] && 
             { [ "$RELEASE_MODE" != "approved" ] || [ "$APPROVED_MAIN_SHA" != "$GITHUB_SHA" ]; }; then
            echo "::error::PAGES_RELEASE_HOLD: security/data changes require an owner Run workflow approval for this exact main SHA"
            exit 1
          fi
          # Re-evaluate against the original published baseline: version.json
          # has already been regenerated in this worktree, so never use it as
          # a fresh baseline for this final check.
          node source/scripts/pages-release-policy.mjs \
            --head "$GITHUB_SHA" --baseline "$RELEASE_BASELINE" \
            --approved "$APPROVED_MAIN_SHA" --assert-mode "$RELEASE_MODE" --print-mode >/dev/null
          test -n "$RELEASE_PUSH_TOKEN" || { echo "::error::PAGES_RELEASE_HOLD: missing push credential"; exit 1; }
          push_auth="$(printf 'x-access-token:%s' "$RELEASE_PUSH_TOKEN" | base64 -w0)"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $push_auth" fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ] ||
             [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::PAGES_RELEASE_HOLD: main advanced; run approval again for the new SHA"
            exit 1
          fi
          git add -A -- index.html assets version.json
          if git diff --cached --quiet -- index.html assets version.json; then
            echo "Pages assets already match exactly approved main SHA; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(pages): publish verified Spark WebApp from approved source"
          # Race-safe: never rebase an artifact onto a newer source commit.
          # If main advances after this fetch, non-force push will fail closed.
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $push_auth" fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::PAGES_RELEASE_HOLD: main advanced before push; rerun owner approval for new SHA"
            exit 1
          fi
          if ! git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $push_auth" push origin HEAD:main; then
            echo "::error::PAGES_RELEASE_HOLD: non-force push rejected; do not retry on newer main"
            exit 1
          fi
          echo "Pages published from CI-verified main SHA (mode: $RELEASE_MODE)."
