name: Build and publish HopHDND Pages
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".nojekyll"
      - "source/src/**"
      - "source/shared/**"
      - "source/scripts/**"
      - "source/pages.html"
      - "source/index.html"
      - "source/vite.config.ts"
      - "source/tsconfig.json"
      - "source/package.json"
      - "source/package-lock.json"
      - ".github/workflows/publish-pages.yml"

permissions:
  contents: write

concurrency:
  group: hophdnd-pages-publish
  cancel-in-progress: false

jobs:
  publish:
    # NEVER publish a new Pages build just because code was merged into main.
    # Operator must first certify BOTH functions + FULL Rules deployment and
    # whitelist the exact new main SHA for a separate, controlled web release.
    if: ${{ github.ref == 'refs/heads/main' && vars.HOPHDND_RELEASE_BACKENDS_CONFIRMED == 'true' && vars.HOPHDND_PAGES_APPROVED_MAIN_SHA == github.sha }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Firebase emulator tests
        run: npm run test:firebase
      - name: Check documentation
        run: npm run docs:check
      - name: Verify approved public HTTPS parent endpoint BEFORE any web build
        env:
          APPROVED_PARENT_ENDPOINT: ${{ vars.HOPHDND_PARENT_COMMIT_ENDPOINT }}
        run: |
          node -e "const u=process.env.APPROVED_PARENT_ENDPOINT;if(!u||!u.startsWith('https://'))throw Error('PAGES_RELEASE_HOLD: approved HTTPS parent endpoint missing');const a=new URL(u);if(a.protocol!=='https:'||a.username||a.password||a.hash||a.search)throw Error('PAGES_RELEASE_HOLD: endpoint unsafe')"
      - name: Build Pages from TypeScript with explicitly approved V2 flags
        env:
          VITE_PARENT_REPLACEMENT_ENABLED: 'true'
          VITE_PARENT_COMMIT_ENDPOINT: ${{ vars.HOPHDND_PARENT_COMMIT_ENDPOINT }}
        run: npm run build:pages
      - name: Copy split Pages build while keeping older hashed assets for cached HTML
        run: |
          # GitHub Pages/browser/CDN may still serve the previous index.html.
          # Deleting its hashed JS breaks the entire app before Firebase can start.
          # Keep previously published hashed assets, never replace the data/rules.
          cp ../index.html /tmp/hophdnd-previous-index.html
          cp dist-pages/index.html ../index.html
          mkdir -p ../assets
          rsync -a dist-pages/assets/ ../assets/
          test -s ../index.html
          test -f ../.nojekyll || { echo "::error::Missing .nojekyll; GitHub Pages Jekyll will parse TypeScript documentation and fail."; exit 1; }
          echo "PAGES_JEKYLL_DISABLED_PASS"
          test -n "$(find ../assets -type f -name '*.js' -print -quit)"
          node scripts/check-published-assets.mjs ../index.html /tmp/hophdnd-previous-index.html ../assets
      - name: Commit and push only if main still matches approved exact SHA
        working-directory: .
        shell: bash
        env:
          APPROVED_MAIN_SHA: ${{ vars.HOPHDND_PAGES_APPROVED_MAIN_SHA }}
          BACKENDS_CONFIRMED: ${{ vars.HOPHDND_RELEASE_BACKENDS_CONFIRMED }}
        run: |
          set -euo pipefail
          # An approval is bound to one exact main commit, not merely a source tree.
          if [ "$GITHUB_REF" != "refs/heads/main" ] ||
             [ "$APPROVED_MAIN_SHA" != "$GITHUB_SHA" ] ||
             [ "$BACKENDS_CONFIRMED" != "true" ]; then
            echo "::error::PAGES_RELEASE_HOLD: main ref or approval does not match job SHA"
            exit 1
          fi
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ] ||
             [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            echo "::error::PAGES_RELEASE_HOLD: main advanced; new SHA requires new approval"
            exit 1
          fi
          git add -A -- index.html assets
          if git diff --cached --quiet -- index.html assets; then
            echo "Pages assets already match exactly approved main SHA; nothing to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build(pages): publish verified split HopHDND source"
          # Race-safe: no rebase onto newer main, even if only docs changed.
          # If main advances after this fetch, non-force push will fail closed.
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "::error::PAGES_RELEASE_HOLD: main advanced before push; re-approve new SHA"
            exit 1
          fi
          if ! git push origin HEAD:main; then
            echo "::error::PAGES_RELEASE_HOLD: non-force push rejected; do not retry on newer main"
            exit 1
          fi
          echo "Pages published from exact approved main SHA."
