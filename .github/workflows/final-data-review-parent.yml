name: FINAL-DATA-REVIEW (PR146 authenticated backup provenance)
on:
  push:
    branches:
      - review/pr142-final-data-crosscheck-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  parent-backup-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    steps:
      - name: Independent review scripts only
        uses: actions/checkout@v4
        with:
          path: reviewer
          persist-credentials: false
      - name: Unmodified PR146 runtime exact SHA in separate checkout
        uses: actions/checkout@v4
        with:
          ref: 9424a52767e8acb57a1f50feba2515787fb2ad26
          path: target-parent
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: target-parent/source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install original parent test deps
        working-directory: target-parent/source
        run: |
          npm ci
          npm install --prefix parent-commit-service --no-package-lock --ignore-scripts
          node parent-commit-service/scripts/build-rules.mjs
      - name: Generate extra tests and runner in test-only temp checkout
        working-directory: target-parent/source
        run: |
          node ../../reviewer/source/data-review/prepare-parent-restore.mjs
          test -s parent-commit-service/test/final-data-review.generated.test.ts
      - name: Actual Auth ID token, HTTP endpoint, scoped Admin and FULL Rules
        working-directory: target-parent/source
        shell: bash
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-hdnd --only database,auth \
            --config parent-commit-service/firebase.parent-commit-test.json \
            "node parent-commit-service/test/final-data-review-run.generated.mjs" 2>&1 |
            tee parent-commit-service/evidence/final-data-review.stdout.log
      - name: Save synthetic-only server before/after and complete stdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-parent-provenance-${{ github.run_id }}
          path: |
            target-parent/source/parent-commit-service/evidence/**
            target-parent/source/parent-commit-service/test/final-data-review.generated.test.ts
            target-parent/source/parent-commit-service/.generated/rules-manifest.json
          if-no-files-found: warn
          retention-days: 30
