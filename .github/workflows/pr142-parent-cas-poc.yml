name: PR142 parent-CAS PoC (isolated Emulator only)
on:
  pull_request:
    paths:
      - source/poc/pr142-parent-cas/**
      - .github/workflows/pr142-parent-cas-poc.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr142-parent-cas-poc-${{ github.ref }}
  cancel-in-progress: true
jobs:
  parent-cas-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned dependencies
        run: npm ci
      - name: Run baseline and trial against localhost Auth/RTDB Emulator
        shell: bash
        run: |
          bash poc/pr142-parent-cas/run.sh "$PWD" "$RUNNER_TEMP/pr142-parent-cas-evidence"
      - name: Upload independent server-before-after witness even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr142-parent-cas-baseline-and-trial-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pr142-parent-cas-evidence/**
          if-no-files-found: warn
          retention-days: 30
