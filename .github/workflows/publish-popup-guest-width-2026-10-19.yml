name: Publish verified HopHDND popup preview
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-popup-guest-width-2026-10-19.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Verify HopHDND source"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: hophdnd-popup-guest-width-preview
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.id == 39288741299 && github.event.workflow_run.head_sha == 'f0547bbf9137d6849c163fcef28c3448ada0a63a' && github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
      - name: Verify immutable successful CI run and artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          base='https://api.github.com/repos/cavoixanh638/HopHDND-WebApp'
          headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'}
          def get(path):
              with urllib.request.urlopen(urllib.request.Request(base+path,headers=headers,timeout=30)) as r:
                  return json.load(r)
          run=get('/actions/runs/39288741299')
          sha='f0547bbf9137d6849c163fcef28c3448ada0a63a'
          assert run['head_sha']==sha and run['name']=='Verify HopHDND source' and run['conclusion']=='success', 'Source CI is not verified'
          jobs=get('/actions/runs/39288741299/jobs')['jobs']
          assert any(j['name']=='verify' and j['conclusion']=='success' for j in jobs), 'Verification job not successful'
          arts=get('/actions/runs/39288741299/artifacts')['artifacts']
          artifact=next(a for a in arts if a['name']=='hophdnd-pages-candidate')
          assert artifact['id']==12203837708 and not artifact['expired'], 'Unexpected or expired artifact'
          assert artifact['workflow_run']['head_sha']==sha, 'Artifact/source commit mismatch'
          assert artifact['digest']=='sha256:ccd9c95a4a7a4443c5199e976b3f092001c6ed5abbfa0c7b8eb71622628c4a10', 'Unexpected artifact digest'
          print('Verified CI #739, SHA:',sha,'Artifact ID:',artifact['id'])
          PY
      - uses: actions/download-artifact@v4
        with:
          name: hophdnd-pages-candidate
          run-id: 39288741299
          repository: cavoixanh638/HopHDND-WebApp
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _popup_verified
      - name: Verify exact HTML and required popup features
        run: |
          set -euo pipefail
          file=_popup_verified/index.html
          test -s "$file"
          echo 'ba42b779cb54322704d588117a00de08ecd47b857958da0561174bcf4cdbb32a  _popup_verified/index.html' | sha256sum --check
          for marker in "report-grid-modal" "report-grid-quick-width" "Độ rộng toàn popup (px)" "deferred-width-field" "readOnlyViewer" "Cấu hình popup / cột" "report-detail-grid"; do
            grep -Fq -- "$marker" "$file" || { echo "::error::Missing feature: $marker"; exit 1; }
          done
          test "$(git rev-parse HEAD:index.html)" = "48aff33fdac08477e38c8f4d49837eb68eee0584"
      - name: Publish only isolated preview directories
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p preview/current preview/guest-readonly-width-2026-10-19
          cp _popup_verified/index.html preview/current/index.html
          cp _popup_verified/index.html preview/guest-readonly-width-2026-10-19/index.html
          if git diff --quiet -- preview/current/index.html preview/guest-readonly-width-2026-10-19/index.html && test -f preview/guest-readonly-width-2026-10-19/index.html; then
            echo "Preview already matches verified CI artifact"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add preview/current/index.html preview/guest-readonly-width-2026-10-19/index.html
          changed="$(git diff --cached --name-only)"
          unexpected="$(printf '%s\n' "$changed" | grep -Ev '^preview/(current|guest-readonly-width-2026-10-19)/index.html$' || true)"
          test -z "$unexpected"
          git commit -m "preview(popup): publish verified CI 739 numerical width and guest controls"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            test "$(git rev-parse HEAD:index.html)" = "48aff33fdac08477e38c8f4d49837eb68eee0584"
            if git push origin HEAD:main; then
              echo "Published preview paths only; production index.html untouched."
              exit 0
            fi
          done
          echo "::error::Verified preview publish failed"
          exit 1
