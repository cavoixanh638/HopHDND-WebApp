name: PR142 unified candidate — two real Functions, one FULL Rules, App regression
on:
  push:
    branches:
      - integration/pr142-cell-parent-freeze-candidate-20261101
  pull_request:
    paths:
      - "source/**"
      - ".github/workflows/pr142-integrated.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr142-integrated-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-app:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 147
    runs-on: ubuntu-latest
    timeout-minutes: 24
    defaults:
      run: {working-directory: source}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: source/package-lock.json}
      - name: App dependency installation
        run: npm ci --no-audit --no-fund
      - name: Authenticated parent + cell services (isolated)
        run: |
          npm install --prefix parent-commit-service --no-package-lock --no-audit --no-fund
          npm install --prefix cell-edit-service --no-package-lock --no-audit --no-fund
      - name: Confirm exact source SHA
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          git rev-parse HEAD
      - name: Typecheck
        id: typecheck
        run: npm run typecheck
      - name: Unit and component regression suites
        if: always()
        run: npm run test -- --exclude tests/firebase-emulator.test.ts --exclude tests/firebase-production-rules.test.ts --exclude tests/exclusive-cell-freeze.test.ts --exclude tests/firebase-tab-auth.test.ts --exclude tests/firebase-versioned-replacement.test.ts --exclude tests/pr142-v2-freeze.test.ts --exclude tests/pr95-independent-rules.test.ts --exclude tests/pr95-independent-race.test.ts --exclude parent-commit-service/test/integration.test.ts
      - name: Build full web application
        if: always()
        run: npm run build
      - name: Build pages test artifact
        if: always()
        run: npm run build:pages:test
      - name: Documentation checks
        if: always()
        run: npm run docs:check
  common-emulator:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 147
    runs-on: ubuntu-latest
    timeout-minutes: 27
    defaults:
      run: {working-directory: source}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: source/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install all 3 isolated dependency graphs
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix cell-edit-service --no-package-lock --no-audit --no-fund
          npm install --prefix parent-commit-service --no-package-lock --no-audit --no-fund
      - name: Browser runtime
        run: npx --prefix cell-edit-service playwright install --with-deps chromium
      - name: Verify EXACT integration Rules and both functions
        run: |
          node --check scripts/pr142-integrated-emulator.mjs
          node --check parent-commit-service/test/run-functions.mjs
          npm run typecheck
          node -e "const f=require('./firebase.staging.json');if(f.functions.length!==2||f.database.rules!=='firebase/database.exclusive-candidate.rules.json')process.exit(1);const r=require('./firebase/database.exclusive-candidate.rules.json').rules.hdnd;if(!r.datasetV2['.write'].includes('parentCasService')||!r.items[String.fromCharCode(36)+'id']['.write'].includes('cellService'))process.exit(2)"
      - name: Auth + BOTH real Functions wrappers + RTDB + FULL Rules + Chrome
        id: integration
        shell: bash
        env:
          PARENT_COMMIT_ENABLED: "true"
          PARENT_DATABASE_URL: https://demo-hdnd.firebaseio.com
          PARENT_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 14m npx firebase emulators:exec --project demo-hdnd --config firebase.staging.json --only auth,database,functions "node scripts/pr142-integrated-emulator.mjs" > pr142-unified-emulator.stdout 2>&1
          rc=$?
          set -e
          echo "PR142_UNIFIED_EMULATOR_EXIT=$rc"
          cat pr142-unified-emulator.stdout
          exit "$rc"
      - name: Real Freeze UI Chrome F1-F5 + deterministic generation races, same FULL Rules
        if: always()
        shell: bash
        env:
          PARENT_COMMIT_ENABLED: "true"
          PARENT_DATABASE_URL: https://demo-hdnd.firebaseio.com
          PARENT_ALLOWED_ORIGINS: http://127.0.0.1:4179
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 9m node scripts/pr143-freeze-ui-browser.mjs > pr142-freeze-ui.stdout 2>&1
          rc=$?
          set -e
          echo "PR142_INTEGRATED_FREEZE_EXIT=$rc"
          tail -c 22000 pr142-freeze-ui.stdout
          exit "$rc"
      - name: Upload ALL evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr142-unified-real-emulator-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/pr142-unified-emulator.stdout
            source/pr142-freeze-ui.stdout
            source/qa-results/pr143-freeze-ui/
            source/cell-edit-service/test/witness.local.json
            source/cell-edit-service/test/browser-witness.local.json
            source/cell-edit-service/test/*.local.png
            source/parent-commit-service/evidence/*
          if-no-files-found: warn
          retention-days: 21

  full-pages-browser:
    if: github.event_name != 'pull_request' || github.event.pull_request.number == 147
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run: {working-directory: source}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24', cache: npm, cache-dependency-path: source/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install App and BOTH Functions service graphs
        run: |
          npm ci --no-audit --no-fund
          npm install --prefix cell-edit-service --no-package-lock --no-audit --no-fund
          npm install --prefix parent-commit-service --no-package-lock --no-audit --no-fund
      - name: Build real pages-test artifact
        run: npm run build:pages:test
      - name: Build the original compact real ItemList fixture required by full Chrome smoke
        run: npm run build:compact:qa
      - name: Run FULL App Chrome guest/admin and Excel preview-stage-activate-replace-restore
        shell: bash
        run: |
          set +e
          timeout --signal=TERM --kill-after=10s 17m node scripts/smoke-pages-browser.mjs > pr142-full-app-browser.stdout 2>&1
          rc=$?
          set -e
          echo "PR142_FULL_APP_CHROME_EXIT=$rc"
          tail -c 35000 pr142-full-app-browser.stdout
          exit "$rc"
      - name: Preserve full Pages Chrome screenshots and server witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr142-full-app-chrome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            source/pr142-full-app-browser.stdout
            source/hophdnd*.png
            source/qa-results/**
          if-no-files-found: warn
          retention-days: 21
