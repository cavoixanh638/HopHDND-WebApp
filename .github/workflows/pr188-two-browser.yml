name: Spark two-browser ACK and latency acceptance
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  two-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select PR scope; fail closed for unknown changes
        id: qa_scope
        run: node ../.github/scripts/ci-pr-scope.mjs --suite two-browser
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
        if: steps.qa_scope.outputs.run != 'false'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
        if: steps.qa_scope.outputs.run != 'false'
      - name: Install locked dependencies and browser driver
        run: |
          npm ci
          npm ci --prefix cell-edit-service --no-audit --no-fund
          command -v google-chrome
        if: steps.qa_scope.outputs.run != 'false'
      - name: Build real Spark client pinned to local demo emulators
        env:
          VITE_FIREBASE_WRITE_MODE: spark
        run: |
          node node_modules/vite/bin/vite.js build --mode pages-test --outDir dist-pages-test
          node scripts/prepare-pages.mjs dist-pages-test
        if: steps.qa_scope.outputs.run != 'false'
      - name: Two independent Chrome processes with synthetic Auth and RTDB
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: npx firebase emulators:exec --project demo-hdnd --config firebase.spark-test.json --only auth,database "node scripts/pr188-two-browser.mjs"
        if: steps.qa_scope.outputs.run != 'false'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.qa_scope.outputs.run != 'false' }}
        with:
          name: pr188-two-browser
          path: source/qa-results/pr188-two-browser/
          if-no-files-found: ignore
