name: Excel schema fingerprint - hidden rows columns sheets, no row-count matching
on:
  push:
    branches: ["feat/20261113-excel-schema-fingerprint"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  schema:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select PR scope; fail closed for unknown changes
        id: qa_scope
        run: node ../.github/scripts/ci-pr-scope.mjs --suite excel-schema
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
        if: steps.qa_scope.outputs.run != 'false'
      - run: npm ci
        if: steps.qa_scope.outputs.run != 'false'
      - name: Verify TypeScript
        run: npm run typecheck
        if: steps.qa_scope.outputs.run != 'false'
      - name: Test fingerprint, original A-O and independent strict workbook contracts
        run: npx vitest run tests/business-excel-schema-fingerprint.test.ts tests/business-excel-original-hdnd.test.ts tests/business-excel.test.ts tests/pr95-independent-parser.test.ts tests/pr95-l4-excel-contract.test.ts
        if: steps.qa_scope.outputs.run != 'false'
      - name: Build public Spark Pages
        run: npm run build:spark
        if: steps.qa_scope.outputs.run != 'false'
