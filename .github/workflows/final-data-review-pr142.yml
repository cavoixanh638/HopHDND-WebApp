name: FINAL-DATA-REVIEW (isolated PR145 stale-generation races)
on:
  push:
    branches:
      - review/pr142-final-data-crosscheck-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-review:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install isolated backend and emulator
        working-directory: source/cell-edit-service
        run: npm install --no-audit --no-fund
      - name: Generate full PR145 Rules trial copy, and REVIEW test copy only
        working-directory: source
        run: |
          node cell-edit-service/scripts/make-test-rules.mjs
          node data-review/prepare-cell-race.mjs
          node --check cell-edit-service/test/final-data-review.generated.mjs
      - name: Execute PR145 30 cases plus independent after-proof race against Auth+Functions+RTDB Emulator
        working-directory: source/cell-edit-service
        shell: bash
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-pr142-cell-edit \
            --config ../firebase.cell-edit.test.json --only auth,database,functions \
            "node test/final-data-review.generated.mjs" 2>&1 | tee test/final-data-review.stdout.log
      - name: Upload server witness (synthetic only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-final-data-review-${{ github.run_id }}
          path: |
            source/cell-edit-service/test/final-data-review.local.json
            source/cell-edit-service/test/witness.local.json
            source/cell-edit-service/test/final-data-review.stdout.log
            source/cell-edit-service/test/final-data-review.generated.mjs
          retention-days: 30
          if-no-files-found: warn
