name: PR95 UI V6 L3 — guest shell and List order (independent)
on:
  pull_request:
    paths:
      - 'source/src/app/App.tsx'
      - 'source/src/qa/pr95-full-preview.tsx'
      - 'source/src/features/items/ItemList.tsx'
      - 'source/src/features/items/pr95-v6-l3-page-layout.css'
      - 'source/tests/pr95-v6-l3-layout.test.ts'
      - 'source/scripts/pr95-v6-l3-guest-layout-browser.mjs'
      - '.github/workflows/pr95-v6-l3-guest-layout.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui-v6-l3-guest-layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install dependencies
        working-directory: source
        run: npm ci
      - name: Typecheck
        working-directory: source
        run: npm run typecheck
      - name: L3 layout and role contract test
        working-directory: source
        run: npm exec -- vitest run tests/pr95-v6-l3-layout.test.ts
      - name: Build synthetic QA source
        working-directory: source
        run: |
          npm run build:compact:qa
          test -s dist-compact-qa/compact-qa.html
      - name: Real Chrome guest/admin DOM, geometry, login and logout
        working-directory: source
        run: node scripts/pr95-v6-l3-guest-layout-browser.mjs
      - name: Archive independent browser evidence (no publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr95-v6-l3-guest-layout-chrome
          path: source/pr95-v6-l3-*.png
          retention-days: 14
          if-no-files-found: warn
