name: Chat4 isolated backup audit + emulator restore (NO production)
on:
  push:
    branches: ["parallel/20261102-chat4-backup"]
    paths:
      - "source/docs/operations/pr149/**"
      - "source/scripts/firebase-backup-*.mjs"
      - "source/parallel-qa/chat4/**"
      - ".github/workflows/parallel-chat4-*.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    defaults:
      run: {working-directory: source}
    env:
      CI: "true"
      GCLOUD_PROJECT: demo-hdnd
      GCP_PROJECT: demo-hdnd
      FIREBASE_DATABASE_URL: https://demo-hdnd.firebaseio.com
      PARENT_DATABASE_URL: https://demo-hdnd.firebaseio.com
      PARENT_COMMIT_ENABLED: "true"
      PARENT_ALLOWED_ORIGINS: http://127.0.0.1:4173
      VITE_PARENT_COMMIT_ENDPOINT: http://127.0.0.1:5001/demo-hdnd/us-central1/parentDatasetCommit
      PR149_SOURCE_SHA: ${{ github.sha }}
      PR149_EXPECT_FRCR_FIXED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: {node-version: "24", cache: npm, cache-dependency-path: source/package-lock.json}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "21"}
      - name: Strict Chat4 scope and syntax guard (shared runtime untouched)
        run: |
          set -euo pipefail
          git rev-parse HEAD
          unexpected="$(git diff --name-only f4aa3184bdde080aa915c826e9192e791fb60b44 HEAD | grep -Ev '^(source/docs/operations/(pr149/.*|PR147_.*\.md)|source/scripts/(firebase-backup-.*\.mjs|firebase-production-readonly-backup\.mjs)|source/parallel-qa/chat4/.*|source/docs/tasks/parallel-20261102/(reports|handoffs)/CHAT_4\.md|\.github/workflows/parallel-chat4-.*\.yml)      - name: Install existing pinned project dependencies and both Functions
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix cell-edit-service --no-audit --no-fund
          npm ci --prefix parent-commit-service --no-audit --no-fund
      - name: Offline source A-O parser and snapshot classifier with positive+negative fixtures
        run: node node_modules/vitest/vitest.mjs run docs/operations/pr149/offline-fixture.test.ts --maxWorkers=1 --reporter=verbose
      - name: Chat4 additional fail-closed restore guard negative fixtures
        run: node --test parallel-qa/chat4/restore-gate.fixture.mjs
      - name: Rehearse real operator command against synthetic approved Excel and full backup
        run: |
          set -euo pipefail
          node docs/operations/pr149/operator-check.mjs \
            --source "$PWD/pr149-ops-evidence/approved-source.xlsx" \
            --sheet Approved \
            --snapshot "$PWD/pr149-ops-evidence/offline-checkpoint.json" \
            --manifest "$PWD/pr149-ops-evidence/offline-manifest.json" \
            --output "$PWD/pr149-ops-evidence/operator-report.json"
      - name: Real Auth, TWO actual Functions, FULL Rules, three Firebase states, FRCR/DR02 and ACK
        timeout-minutes: 14
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 12m npx firebase emulators:exec --project demo-hdnd --config firebase.staging.json --only auth,database,functions "node docs/operations/pr149/emulator-run.mjs" > pr149-ops-evidence-emulator.log 2>&1 || {
            cat pr149-ops-evidence-emulator.log
            exit 1
          }
          cat pr149-ops-evidence-emulator.log
      - name: Standalone actual operator bootstrap API from approved synthetic A-O Excel (NO fixture seeding)
        timeout-minutes: 7
        run: |
          set -euo pipefail
          export PR149_ONLY_OPERATOR_BOOTSTRAP=true
          export PR149_BOOTSTRAP_XLSX="$PWD/pr149-ops-evidence/approved-source.xlsx"
          export PR149_BOOTSTRAP_SHEET=Approved
          timeout --signal=TERM --kill-after=10s 6m npx firebase emulators:exec --project demo-hdnd --config firebase.staging.json --only auth,database,functions "node docs/operations/pr149/emulator-run.mjs"
      - name: Existing isolated backup verifier regression (no production)
        run: node --test scripts/firebase-backup-verify.fixture.mjs
      - name: Actual synthetic full-root backup RESTORE in separate Emulator namespace
        timeout-minutes: 7
        run: |
          set -euo pipefail
          test -f pr149-ops-evidence/rtdb.before.json
          export HDND_PRIVATE_BACKUP="$PWD/pr149-ops-evidence/rtdb.before.json"
          export HDND_PRIVATE_MANIFEST="$PWD/pr149-ops-evidence/manifest.demo.json"
          timeout --signal=TERM --kill-after=10s 6m npx firebase emulators:exec --project demo-hdnd-restore --only database --config scripts/restore-emulator/firebase.json "node scripts/firebase-backup-emulator-restore.mjs && node docs/operations/pr149/verify-restored.mjs"
      - name: Upload non-production synthetic witnesses and verdicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parallel-chat4-backup-${{ github.run_id }}-demo-only
          path: |
            source/pr149-ops-evidence/
            source/pr149-ops-evidence-emulator.log
          retention-days: 14
          if-no-files-found: warn
 || true)"
          if test -n "$unexpected"; then echo "CHAT4_SCOPE_VIOLATION $unexpected"; exit 2; fi
          node --check docs/operations/pr149/offline-audit-core.mjs
          node --check docs/operations/pr149/operator-check.mjs
          node --check docs/operations/pr149/verify-restored.mjs
          node --check docs/operations/pr149/emulator-run.mjs
          node --check scripts/firebase-backup-emulator-restore.mjs
          node --check parallel-qa/chat4/restore-gate.fixture.mjs
      - name: Install existing pinned project dependencies and both Functions
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix cell-edit-service --no-audit --no-fund
