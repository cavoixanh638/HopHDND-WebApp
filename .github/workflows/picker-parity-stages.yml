name: picker-parity-stages - exact-SHA isolated stage acceptance (NO deploy)
on:
  push:
    branches:
      - ui/20261107-picker-parity-stages
    paths:
      - 'source/picker-parity-stages-*.html'
      - 'source/src/features/items/picker-parity-stages.css'
      - 'source/src/features/items/l03-track-widths.css'
      - 'source/tests/picker-parity-stages*'
      - 'source/scripts/picker-parity-stages*'
      - '.github/workflows/picker-parity-stages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: picker-parity-stages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0 # detached immutable e095205c reference for matching snapshots
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Install locked dependencies and real Chromium
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix cell-edit-service --no-audit --no-fund
          npx --prefix cell-edit-service playwright install --with-deps chromium
      - name: TypeScript
        run: npm run typecheck
      - name: Own unit and existing five-rail regression
        run: npm test -- tests/picker-parity-stages.test.ts tests/picker-parity-stages-permissions.test.tsx tests/ui-20261106-tracks.test.ts
      - name: Build full synthetic App
        run: |
          npm run build:compact:qa
          test -s dist-compact-qa/compact-qa.html
      - name: Codex F02 real Không, keyboard Enter/Space, palette/highlight
        run: node scripts/picker-parity-stages-review-browser.mjs
      - name: Existing 32-scenario Chromium regression (unchanged)
        run: node scripts/picker-parity-stages-browser.mjs
      - name: Real Chromium five-input track-width regression
        run: node scripts/ui-20261106-tracks-browser.mjs
      - name: Capture baseline vs STAGES on ONE fixture, 12 matched cases
        run: |
          set -euo pipefail
          baseline=e095205c1f4ea79ef81e8d2cd7b386dcfdb259fa
          worktree="$RUNNER_TEMP/picker-parity-stages-baseline"
          main="$PWD"
          git worktree add --detach "$worktree" "$baseline"
          trap 'git worktree remove --force "$worktree" 2>/dev/null || true' EXIT
          cp tests/picker-parity-stages-review-fixture.tsx "$worktree/source/tests/"
          cp picker-parity-stages-review-fixture.html "$worktree/source/"
          cp scripts/picker-parity-stages-before-after.mjs "$worktree/source/scripts/"
          ln -s "$main/node_modules" "$worktree/source/node_modules"
          ln -s "$main/cell-edit-service/node_modules" "$worktree/source/cell-edit-service/node_modules"
          test "$(git -C "$worktree" rev-parse HEAD)" = "$baseline"
          (
            cd "$worktree/source"
            STAGES_VARIANT=before STAGES_ARTIFACT_DIR="$main/qa-results/picker-parity-stages" \
              node scripts/picker-parity-stages-before-after.mjs
          )
          # Check never edited existing application components/CSS in baseline.
          test -z "$(git -C "$worktree" diff --name-only -- source/src)"
          STAGES_VARIANT=after node scripts/picker-parity-stages-before-after.mjs
          node scripts/picker-parity-stages-compare.mjs
          test -s qa-results/picker-parity-stages/comparison/matched-diff.json
      - name: Export exact-source evidence
        if: always()
        run: |
          mkdir -p qa-results/picker-parity-stages
          printf '%s\n' "$GITHUB_SHA" > qa-results/picker-parity-stages/tested-sha.txt
          if [ -d dist-compact-qa ]; then
            find dist-compact-qa -type f -print0 | sort -z | xargs -0 sha256sum > qa-results/picker-parity-stages/assets-sha256.txt
          fi
      - name: Upload browser screenshots and computed rectangles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: picker-parity-stages-${{ github.run_id }}-${{ github.sha }}
          path: |
            source/qa-results/picker-parity-stages/
            source/qa-results/ui-20261106-tracks/
          if-no-files-found: warn
          retention-days: 14
