name: PR95 UI V6 L1 — Loại VB + Cấp trình (NO PUBLISH)
on:
  pull_request:
    paths:
      - 'source/src/features/items/CompactGroupedValue.tsx'
      - 'source/src/features/items/item-frame.css'
      - 'source/src/features/items/ItemList.tsx'
      - 'source/src/features/reports/ReportDetailGrid.tsx'
      - 'source/pr95-v6-l1-*'
      - 'source/scripts/pr95-v6-l1-*'
      - 'source/tests/pr95-v6-l1-*'
      - '.github/workflows/pr95-v6-l1-type-level.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-v6-l1-type-level:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Install frozen dependencies
        working-directory: source
        run: npm ci
      - name: Typecheck source and V6 L1 fixture
        working-directory: source
        run: npm run typecheck
      - name: Unit — type catalog, legacy and exact caption shape
        working-directory: source
        run: npm exec -- vitest run tests/pr95-v6-l1-type-level.test.tsx tests/cell-picker-lazy.test.tsx
      - name: Real Chrome — List/Popup/readonly/granted/three levels/narrow/mobile
        working-directory: source
        run: node scripts/pr95-v6-l1-browser.mjs
      - name: Store exact-head V6 L1 real Chrome screenshots (no publish)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr95-v6-l1-real-chrome-type-level
          path: source/pr95-v6-l1-*.png
          if-no-files-found: warn
          retention-days: 14
