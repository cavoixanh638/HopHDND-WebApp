name: Candidate Spark status single-CAS security (NO DEPLOY)
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  direct-status-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Select PR scope; fail closed for unknown changes
        id: qa_scope
        run: node ../.github/scripts/ci-pr-scope.mjs --suite status-cas
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
        if: steps.qa_scope.outputs.run != 'false'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
        if: steps.qa_scope.outputs.run != 'false'
      - name: Install locked source dependencies
        run: npm ci --no-audit --no-fund
        if: steps.qa_scope.outputs.run != 'false'
      - name: Rebuild exact candidate Spark Rules and fail on drift
        run: |
          npm run rules:spark
          git diff --exit-code -- firebase/database.spark.rules.json
        if: steps.qa_scope.outputs.run != 'false'
      - name: Typecheck source and fast-status contract
        env:
          VITE_FIREBASE_WRITE_MODE: spark
          VITE_FIREBASE_STATUS_CAS: 'true'
        run: npm run typecheck
        if: steps.qa_scope.outputs.run != 'false'
      - name: Isolated Auth and RTDB security matrix - no production
        env:
          VITE_FIREBASE_WRITE_MODE: spark
          VITE_FIREBASE_STATUS_CAS: 'true'
        run: npx firebase emulators:exec --project demo-hdnd --config firebase.spark-test.json --only auth,database "node node_modules/vitest/vitest.mjs run tests/spark-direct-status-cas.test.ts tests/pr190-independent-security.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism"
        if: steps.qa_scope.outputs.run != 'false'
      - name: Install locked local browser runner
        run: |
          npm ci --prefix cell-edit-service --no-audit --no-fund
          command -v google-chrome
        if: steps.qa_scope.outputs.run != 'false'
      - name: Build real Spark candidate pinned to local emulators
        env:
          VITE_FIREBASE_WRITE_MODE: spark
          VITE_FIREBASE_STATUS_CAS: 'true'
        run: |
          node node_modules/vite/bin/vite.js build --mode pages-test --outDir dist-pages-test
          node scripts/prepare-pages.mjs dist-pages-test
        if: steps.qa_scope.outputs.run != 'false'
      - name: Two independent Chromium processes - direct CAS and conflict
        env:
          CHROME_PATH: /usr/bin/google-chrome
          VITE_FIREBASE_WRITE_MODE: spark
          VITE_FIREBASE_STATUS_CAS: 'true'
        run: npx firebase emulators:exec --project demo-hdnd --config firebase.spark-test.json --only auth,database "node scripts/pr190-two-browser.mjs"
        if: steps.qa_scope.outputs.run != 'false'
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.qa_scope.outputs.run != 'false' }}
        with:
          name: pr190-single-cas-two-browser
          path: source/qa-results/pr190-two-browser/
          if-no-files-found: ignore
