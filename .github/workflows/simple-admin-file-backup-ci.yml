name: Simple admin backup and direct Firebase maintenance (NO DEPLOY)
on:
  push:
    branches: ["release/20261112-spark-simple-admin-main-candidate"]
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  simple-admin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm ci --prefix parent-commit-service --no-audit --no-fund
      - name: Rebuild production-candidate Rules without drift
        run: |
          npm run rules:spark
          git diff --exit-code -- firebase/database.spark.rules.json
      - run: npm run typecheck
      - run: npx vitest run tests/simple-admin-data.test.ts
      - name: Existing Auth + RTDB Emulator baseline
        run: npm run test:spark
      - name: Build Spark SPA, never deploy
        run: npm run build:spark
      - name: Confirm no paid service or privileged key is required
        run: |
          test ! -f .env.production
          node -e "const fs=require('fs');const s=fs.readFileSync('src/data/simple-admin-data.ts','utf8');if(/SERVICE_ACCOUNT_JSON|BACKUP_HMAC_SECRET|MAINTENANCE_ARCHIVE_BUCKET|Cloudflare|R2/.test(s.replace(/\/\*[\s\S]*?\*\//g,'')))throw Error('Unexpected hosted backup dependency')"
