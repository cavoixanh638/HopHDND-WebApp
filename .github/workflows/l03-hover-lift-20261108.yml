name: L01/L03 compact UI corrections - exact Chromium proof (NO DEPLOY)
on:
  push:
    branches:
      - ui/20261108-l03-hover-lift-fix
permissions:
  contents: read
jobs:
  hover-lift-ui-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Source pin and permitted CSS/browser scope
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          cd "$GITHUB_WORKSPACE"
          baseline=a6aa9f13aeac8a12add4a479dc7c1f97e91180db
          git cat-file -e "$baseline^{commit}"
          while IFS= read -r file; do
            case "$file" in
              source/src/features/items/item-frame.css|\
              source/src/features/items/inline-note-hit-area.css|\
              source/src/features/items/activate-editable-cell.ts|\
              source/src/features/items/ItemList.tsx|\
              source/src/features/reports/ReportDetailGrid.tsx|\
              source/src/components/SharedEditTooltip.ts|\
              source/src/qa/compact-qa-main.tsx|\
              source/src/qa/pr95-full-preview.tsx|\
              source/src/qa/pr95-full-preview.css|\
              source/src/features/items/ActiveListFilters.tsx|\
              source/src/features/items/ItemSummaryCards.tsx|\
              source/src/features/items/list-filter-toolbar.css|\
              source/src/features/items/list-toolbar-filters.ts|\
              source/src/features/items/list-print.ts|\
              source/src/features/items/bulk-paste.ts|\
              source/src/features/items/BulkPasteModal.tsx|\
              source/tests/bulk-paste.test.ts|\
              source/tests/list-print.test.ts|\
              source/tests/list-search-scope.test.ts|\
              source/tests/list-search-scope.test.ts|\
              source/tests/list-print.test.ts|\
              source/src/features/items/CompactGroupedValue.tsx|\
              source/src/features/items/picker-parity-content.css|\
              source/src/features/items/picker-parity-stages.css|\
              source/src/data/item-preferences.ts|\
              source/src/data/status-palettes.ts|\
              source/tests/activate-editable-cell.test.ts|\
              source/tests/picker-parity-content.test.tsx|\
              source/tests/compact-group-highlights.test.tsx|\
              source/tests/ui-20261104-worker-a.test.tsx|\
              source/tests/picker-parity-stages.test.ts|\
              source/tests/ui-20261106-tracks.test.ts|\
              source/tests/status-palettes.test.ts|\
              source/tests/item-summary.test.ts|\
              source/tests/pr95-ui-v2-l2-palette.test.ts|\
              source/tests/pr95-v6-l3-layout.test.ts|\
              source/tests/pr95-20261108-filter-shell.test.tsx|\
              source/tests/pr95-v6-l4-active-filters.test.tsx|\
              source/scripts/pr95-v6-l3-guest-layout-browser.mjs|\
              source/scripts/picker-parity-content-browser.mjs|\
              source/scripts/picker-parity-stages-browser.mjs|\
              source/scripts/pr95-v6-l4-browser.mjs|\
              source/scripts/pr95-clipboard-print-browser.mjs|\
              source/scripts/hover-motion-audit-browser.mjs|\
              source/scripts/ui-20261106-tracks-browser.mjs|\
              source/docs/tasks/parallel-20261108-l03-hover/*) ;;
              *) echo "OUT_OF_SCOPE source modification: $file"; exit 1 ;;
            esac
          done < <(git diff --name-only "$baseline" HEAD -- source)
          test -z "$(git diff --name-only "$baseline" HEAD -- source/src/features/items/CellPicker.tsx source/src/features/items/l03-track-widths.css source/src/styles/app.css source/shared source/firebase source/server)"
          echo "L03_HOVER_SCOPE_GUARD_PASS"
      - name: Install pinned dependencies and Chromium
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix cell-edit-service --no-audit --no-fund
          npx --prefix cell-edit-service playwright install chromium
      - name: Typecheck, full unit suite and both applications
        run: |
          set -eu
          npm run typecheck
          npm test
          npm run build
          npm run build:compact:qa
          test -s dist/Dashboard_HĐND.html
          test -s dist-compact-qa/compact-qa.html
      - name: Real Chromium L03 geometry, palette, permissions and L04 untouched
        run: |
          set -eu
          node scripts/picker-parity-stages-browser.mjs
          node scripts/picker-parity-stages-review-browser.mjs
          node scripts/ui-20261106-picker-browser.mjs
          node scripts/ui-20261106-tracks-browser.mjs
          node scripts/picker-parity-content-browser.mjs
          node scripts/pr95-v6-l4-browser.mjs
          node scripts/pr95-clipboard-print-browser.mjs
          node scripts/ui-20261106-commander-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l03-hover-geometry-and-regression
          if-no-files-found: warn
          retention-days: 14
          path: |
            source/qa-results/picker-parity-stages/**
            source/qa-results/picker-parity-content/**
            source/qa-results/ui-20261106-*/**
            source/qa-results/print-a4/**
