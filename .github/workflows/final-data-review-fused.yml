name: FINAL-DATA-REVIEW (three-PR fused Rules in isolated checkouts)
on:
  push:
    branches:
      - review/pr142-final-data-crosscheck-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  three-way-rules-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with: {path: reviewer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: bf78bdddf336f16082ad68db1c1f39723bc95251
          path: cell-target
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 9424a52767e8acb57a1f50feba2515787fb2ad26
          path: parent-target
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: c039405a9ad6802ae1d412465cc91b88745a0371
          path: freeze-target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Compose FULL Rules in temporary test workspace (no runtime merge)
        run: |
          node reviewer/source/data-review/build-fused-rules.mjs \
            freeze-target/source/firebase/database.exclusive-candidate.rules.json \
            reviewer/evidence/fused-full.rules.json
          mkdir -p parent-target/source/parent-commit-service/.generated
          mkdir -p cell-target/source/cell-edit-service/generated
          cp reviewer/evidence/fused-full.rules.json parent-target/source/parent-commit-service/.generated/trial.rules.json
          cp reviewer/evidence/fused-full.rules.json cell-target/source/cell-edit-service/generated/database.rules.json
          cmp reviewer/evidence/fused-full.rules.json parent-target/source/parent-commit-service/.generated/trial.rules.json
          cmp reviewer/evidence/fused-full.rules.json cell-target/source/cell-edit-service/generated/database.rules.json
      - name: Install unmodified parent runtime dependencies
        working-directory: parent-target/source
        run: |
          npm ci
          npm install --prefix parent-commit-service --no-package-lock --ignore-scripts
      - name: Test authenticated parent endpoint against three-way fused Rules
        working-directory: parent-target/source
        shell: bash
        run: |
          mkdir -p parent-commit-service/evidence
          set -o pipefail
          npx firebase emulators:exec --project demo-hdnd --only database,auth \
            --config parent-commit-service/firebase.parent-commit-test.json \
            "node parent-commit-service/test/run.mjs" 2>&1 | tee parent-commit-service/evidence/fused-endpoint.log
      - name: Install unmodified cell gateway dependencies
        working-directory: cell-target/source/cell-edit-service
        run: npm install --no-audit --no-fund
      - name: Test Auth+Functions+RTDB cell gateway against same fused Rules
        working-directory: cell-target/source/cell-edit-service
        shell: bash
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-pr142-cell-edit \
            --config ../firebase.cell-edit.test.json --only auth,database,functions \
            "node test/integration.mjs" 2>&1 | tee test/fused-cell.log
      - name: Verify PR143 receipt stale-pointer server rejection against same fused Rules
        working-directory: freeze-target/source
        shell: bash
        run: |
          npm ci
          cp ../../reviewer/evidence/fused-full.rules.json firebase/database.exclusive-candidate.rules.json
          set -o pipefail
          npx firebase emulators:exec --project demo-hdnd-pr142-freeze --only database,auth \
            --config firebase.staging.json \
            "npx vitest run tests/pr142-v2-freeze.test.ts -t 'F4c' --no-file-parallelism" 2>&1 |
            tee ../../reviewer/evidence/fused-freeze-f4c.log
      - name: Upload exactly fused Rules + independent test outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-data-review-three-way-rules-${{ github.run_id }}
          path: |
            reviewer/evidence/**
            parent-target/source/parent-commit-service/evidence/fused-endpoint.log
            cell-target/source/cell-edit-service/test/fused-cell.log
            cell-target/source/cell-edit-service/test/witness.local.json
            parent-target/source/parent-commit-service/evidence/integration-witness.json
          retention-days: 30
          if-no-files-found: warn
