name: Publish isolated L01-L03 UI preview (RAM only - no production)
on:
  push:
    branches:
      - ui/20261108-l03-hover-lift-fix
    paths:
      - .github/workflows/l03-hover-public-preview-20261108.yml
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: hophdnd-l03-hover-isolated-preview
  cancel-in-progress: false
jobs:
  publish-isolated-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout immutable exact QA-passed source, not docs-only HEAD
        uses: actions/checkout@v4
        with:
          ref: b11f18adb41ff0eb12219377fa6d2e8c174ff07f
          persist-credentials: true
          fetch-depth: 0
      - name: Verify pinned feature revision and offline QA entry
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b11f18adb41ff0eb12219377fa6d2e8c174ff07f"
          test -f source/compact-qa.html
          test -f .nojekyll
          grep -Fq "RAM demo" source/docs/tasks/parallel-20261108-l03-hover/CHECKPOINT.md 2>/dev/null || true
          echo "L03_PREVIEW_SOURCE_SHA b11f18adb41ff0eb12219377fa6d2e8c174ff07f"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Compile synthetic-only preview and install browser tooling
        working-directory: source
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm ci --prefix cell-edit-service --no-audit --no-fund
          npx --prefix cell-edit-service playwright install chromium
          npm run typecheck
          npm run build:compact:qa
          test -s dist-compact-qa/compact-qa.html
          test -n "$(find dist-compact-qa/assets -maxdepth 1 -name '*.js' -print -quit)"
          test -n "$(find dist-compact-qa/assets -maxdepth 1 -name '*.css' -print -quit)"
          grep -Fq 'Dữ liệu giả' dist-compact-qa/compact-qa.html
          ! grep -REiq 'https?://[^"[:space:]]*(firebaseio|firebasedatabase|docs.google.com/spreadsheets)' dist-compact-qa/assets
          echo "b11f18adb41ff0eb12219377fa6d2e8c174ff07f" > dist-compact-qa/source-sha.txt
          (cd dist-compact-qa && sha256sum compact-qa.html assets/* > asset-sha256.txt)
      - name: Check Pages uses main root before touching any public branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/cavoixanh638/HopHDND-WebApp"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          curl --fail --silent --show-error "${headers[@]}" "$api/pages" > "$RUNNER_TEMP/l03-pages-config.json"
          node -e 'const p=require(process.env.RUNNER_TEMP+"/l03-pages-config.json");if(p.source?.branch!=="main"||p.source?.path!=="/")throw Error("PUBLIC_PAGES_SOURCE_NOT_MAIN_ROOT: "+JSON.stringify(p.source));console.log("PUBLIC_PAGES_CONFIGURATION_PASS",JSON.stringify(p.source));'
      - name: Publish only preview/l03-hover-20261108 into main Pages tree
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          dest="$RUNNER_TEMP/l03-hover-pages"
          git worktree add --detach "$dest" origin/main
          test -f "$dest/.nojekyll"
          test -s "$dest/index.html"
          before_index="$(sha256sum "$dest/index.html" | cut -d' ' -f1)"
          mkdir -p "$dest/preview/l03-hover-20261108/assets"
          cp source/dist-compact-qa/compact-qa.html "$dest/preview/l03-hover-20261108/index.html"
          cp source/dist-compact-qa/source-sha.txt "$dest/preview/l03-hover-20261108/source-sha.txt"
          cp source/dist-compact-qa/asset-sha256.txt "$dest/preview/l03-hover-20261108/asset-sha256.txt"
          rsync -a --delete source/dist-compact-qa/assets/ "$dest/preview/l03-hover-20261108/assets/"
          test "$(sha256sum "$dest/index.html" | cut -d' ' -f1)" = "$before_index"
          git -C "$dest" add -A -- preview/l03-hover-20261108
          changed="$(git -C "$dest" diff --cached --name-only)"
          if [ -z "$changed" ]; then echo "L03_PREVIEW_CONTENT_UNCHANGED"; exit 0; fi
          while IFS= read -r file; do
            case "$file" in
              preview/l03-hover-20261108/*) ;;
              *) echo "::error::Unsafe Pages file staged: $file"; exit 1 ;;
            esac
          done <<< "$changed"
          git -C "$dest" diff --quiet -- index.html assets source .github .nojekyll
          git -C "$dest" config user.name 'github-actions[bot]'
          git -C "$dest" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$dest" commit -m 'docs(preview): publish isolated synthetic L03 -3px hover preview'
          git -C "$dest" push origin HEAD:main
          echo "L03_PREVIEW_PAGES_SUBPATH_ONLY preview/l03-hover-20261108"
          echo "L03_PREVIEW_PAGES_SOURCE_SHA b11f18adb41ff0eb12219377fa6d2e8c174ff07f"
      - name: Request Pages rebuild and verify public HTML plus actual JS/CSS bytes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/cavoixanh638/HopHDND-WebApp"
          headers=(-H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json')
          curl --fail --silent --show-error -X POST "${headers[@]}" "$api/pages/builds" > "$RUNNER_TEMP/l03-pages-build.json"
          base="https://cavoixanh638.github.io/HopHDND-WebApp/preview/l03-hover-20261108/"
          ok=0
          for attempt in {1..40}; do
            code="$(curl --location --silent --show-error --max-time 20 -o "$RUNNER_TEMP/l03-live.html" -w '%{http_code}' "$base" || true)"
            if [ "$code" = 200 ] &&
                cmp -s "$RUNNER_TEMP/l03-live.html" source/dist-compact-qa/compact-qa.html; then
              ok=1;break
            fi
            echo "L03_PREVIEW_PAGES_PROPAGATION attempt=$attempt HTTP=$code"
            sleep 5
          done
          test "$ok" -eq 1 || { echo "::error::Published HTML not yet served at exact URL";exit 1; }
          for asset in $(grep -oE '\./assets/[^"]+\.(js|css)' "$RUNNER_TEMP/l03-live.html"); do
            test -n "$asset"
            curl --fail --location --silent --show-error --max-time 25 "$base$asset" > "$RUNNER_TEMP/l03-live-asset"
            test -s "$RUNNER_TEMP/l03-live-asset"
            cmp -s "$RUNNER_TEMP/l03-live-asset" "source/dist-compact-qa/${asset#./}" ||
              { echo "::error::Public asset hash mismatches candidate: $asset";exit 1; }
            echo "L03_PREVIEW_PUBLIC_ASSET_HASH_MATCH $asset"
          done
          curl --fail --silent --show-error "$base/source-sha.txt" | grep -Fxq 'b11f18adb41ff0eb12219377fa6d2e8c174ff07f'
          echo "L03_PREVIEW_PUBLIC_HTTP_ASSETS_SOURCE_PASS $base"
      - name: Real Chromium LIVE UI smoke and measured -3px hover on GitHub Pages
        working-directory: source
        env:
          L03_LIVE_BASE: https://cavoixanh638.github.io/HopHDND-WebApp/preview/l03-hover-20261108/
        run: |
          node --input-type=module <<'NODE'
          import {createRequire} from 'node:module';
          import {mkdirSync,writeFileSync} from 'node:fs';
          import assert from 'node:assert/strict';
          const require=createRequire(import.meta.url);
          const {chromium}=require('./cell-edit-service/node_modules/playwright');
          const base=process.env.L03_LIVE_BASE;
          const dir='qa-results/l03-live-public';
          mkdirSync(dir,{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--no-sandbox','--disable-dev-shm-usage']});
          const record=[];
          const external=[];
          const near=(a,b,t=.35)=>Math.abs(a-b)<=t;
          // Verify the ACTUAL public React DOM, not source-code text or images.
          async function verifyLayout(page,root,label,mode){
            const state=await page.locator(root).first().evaluate(el=>{
              const heading=el.querySelector('[data-ui-reference-group="L01"] .compact-document-heading');
              const type=heading?.querySelector('[data-ui-reference-part="type"]');
              const dep=heading?.querySelector('[data-ui-reference-part="department"]');
              const stage=el.querySelector('.compact-stages[data-rev2="true"]');
              const readonly=el.querySelector('.compact-stages[data-rev2="true"] .compact-stage-state:not([data-editable="true"])');
              const notSubmitted=el.querySelector('.compact-stages[data-rev2="true"] .compact-stage-state[data-progress-tone="not-submitted"]:not([data-highlighted="true"])');
              const paintedStatus=notSubmitted?.querySelector('button.cell-picker-trigger')??notSubmitted;
              const editableStatus=el.querySelector('.compact-stages[data-rev2="true"] .compact-stage-state[data-editable="true"] button.cell-picker-trigger');
              const readonlyText=readonly?.querySelector('.workflow-status-value,.compact-part')??readonly;
              const editableText=editableStatus?.querySelector('.cell-picker-value-text');
              const css=node=>node?getComputedStyle(node):null;
              // Verify equal ACTUAL painted heights with identical one-line
              // text in mixed-rights mode, then restore the synthetic UI DOM.
              let sameTextHeight=null;
              if(readonlyText&&editableText){
                const oldReadonly=readonlyText.textContent,oldEditable=editableText.textContent;
                readonlyText.textContent='Hoàn thành';editableText.textContent='Hoàn thành';
                sameTextHeight={
                  readonly:readonly.getBoundingClientRect().height,
                  editable:editableStatus.getBoundingClientRect().height
                };
                readonlyText.textContent=oldReadonly;editableText.textContent=oldEditable;
              }
              const typography=node=>node?{
                size:css(node).fontSize,weight:css(node).fontWeight,
                family:css(node).fontFamily,lineHeight:css(node).lineHeight
              }:null;
              return {
                meta:heading?{justify:css(heading).justifyContent,textAlign:css(heading).textAlign,
                  typeFirst:!type||!dep||!!(type.compareDocumentPosition(dep)&Node.DOCUMENT_POSITION_FOLLOWING)}:null,
                grid:stage?css(stage).gridTemplateColumns.split(/\s+/).map(parseFloat):null,
                levelMode:stage?.dataset.levelLayout,
                readonly:readonly?{justify:css(readonly).justifyContent,textAlign:css(readonly).textAlign,
                  nested:css(readonlyText)?.textAlign,
                  minHeight:css(readonly).minHeight,padding:css(readonly).padding,
                  border:css(readonly).borderTopWidth,
                  typography:typography(readonly),textTypography:typography(readonlyText)}:null,
                sameTextHeight,
                editableTypography:typography(editableStatus),
                source:paintedStatus?{bg:css(paintedStatus).backgroundColor,color:css(paintedStatus).color}:null
              };
            });
            assert(state.meta,label+' missing L01 metadata');
            assert.equal(state.meta.justify,'flex-start',label+' L01 metadata not left');
            assert.equal(state.meta.textAlign,'left',label+' L01 metadata text not left');
            assert(state.meta.typeFirst,label+' L01 type not before department');
            if(mode==='editable'){
              assert.deepEqual(state.grid,[120,76,120],label+' editable rails differ from screenshot');
              assert.equal(state.levelMode,'editable',label+' expected 3-track level');
            }
            if(mode==='readonly'){
              assert.deepEqual(state.grid,[128,164],label+' readonly rails wrong');
              assert.equal(state.levelMode,'readonly',label+' expected 2 tracks');
            }
            if(state.readonly){
              assert.equal(state.readonly.justify,'center',label+' readonly status not centered');
              assert.equal(state.readonly.textAlign,'center',label+' readonly status text not centered');
              if(state.readonly.nested)assert.equal(state.readonly.nested,'center',label+' readonly nested text not centered');
              assert.equal(state.readonly.typography.size,'11px',label+' readonly font-size mismatch');
              assert.equal(state.readonly.typography.weight,'550',label+' readonly font weight mismatch');
              assert.equal(state.readonly.minHeight,'26px',label+' readonly minimum status height differs from picker');
              assert.equal(state.readonly.padding,'5px 4px',label+' readonly height compensation is missing');
              assert.equal(state.readonly.border,'0px',label+' readonly must remain borderless');
              if(state.sameTextHeight){
                assert(near(state.sameTextHeight.readonly,state.sameTextHeight.editable,.35),
                  label+' READONLY HEIGHT DIFFERS FROM EDITABLE '+JSON.stringify(state.sameTextHeight));
                assert(near(state.sameTextHeight.readonly,26,.35),
                  label+' single-line status height should be 26px');
              }
              assert.deepEqual(state.readonly.textTypography,state.readonly.typography,
                label+' nested readonly typography differs from its wrapper');
              if(state.editableTypography)assert.deepEqual(state.readonly.typography,state.editableTypography,
                label+' mixed read-only/editable typography differs');
            }
            if(state.source){
              assert.equal(state.source.bg,'rgb(255, 227, 233)',label+' source background not reinforced');
              assert.equal(state.source.color,'rgb(163, 45, 70)',label+' source text not reinforced');
            }
            record.push({label:label+'-layout',state});
          }
          async function checkLift(page,root,label){
            const btn=page.locator(root+' .compact-stages[data-rev2="true"] .compact-stage-state[data-editable="true"] button.cell-picker-trigger').first();
            await btn.waitFor({timeout:25000});
            await btn.scrollIntoViewIfNeeded();
            await page.mouse.move(0,0);
            await page.waitForTimeout(235);
            const before=await btn.evaluate(el=>{
              const s=getComputedStyle(el);return {y:el.getBoundingClientRect().y,
                w:el.getBoundingClientRect().width,borderWidth:s.borderTopWidth,
                paddingLeft:s.paddingLeft,paddingRight:s.paddingRight,
                caretGap:s.columnGap,
                borderColor:s.borderTopColor,color:s.color,background:s.backgroundColor};
            });
            await btn.hover();
            await page.waitForTimeout(235);
            const after=await btn.evaluate(el=>({y:el.getBoundingClientRect().y,
              w:el.getBoundingClientRect().width,
              transform:getComputedStyle(el).transform,
              background:getComputedStyle(el).backgroundColor,
              color:getComputedStyle(el).color,
              borderColor:getComputedStyle(el).borderTopColor,
              borderWidth:getComputedStyle(el).borderTopWidth,
              outlineColor:getComputedStyle(el).outlineColor,
              outlineWidth:getComputedStyle(el).outlineWidth,
              shadow:getComputedStyle(el).boxShadow,
              outline:getComputedStyle(el).outlineStyle}));
            const parsed=after.transform==='none'?0:Number(after.transform.match(/matrix\([^,]+,[^,]+,[^,]+,[^,]+,[^,]+,\s*([-\d.]+)/)?.[1]);
            assert(Number.isFinite(parsed));
            assert(near(after.y-before.y,-3),label+' painted dy '+(after.y-before.y));
            assert(near(parsed,-3,.15),label+' computed translateY '+parsed);
            assert(near(before.w,after.w),label+' changed width');
            assert(after.shadow!=='none'&&after.outline==='solid',label+' no visible shadow/outline');
            assert.equal(before.borderWidth,'1px',label+' resting border unexpectedly changed');
            assert.equal(before.paddingLeft,'4px',label+' status left padding is not compact');
            assert.equal(before.paddingRight,'4px',label+' status right padding is not compact');
            assert.equal(before.caretGap,'3px',label+' unnecessary caret gap');
            assert.equal(after.borderWidth,'1px',label+' hover border thickness not preserved');
            assert.equal(after.outlineWidth,'2px',label+' hover outline thickness not preserved');
            assert.equal(after.borderColor,after.color,label+' hover border not semantic');
            assert.equal(after.outlineColor,after.color,label+' hover outline not semantic');
            assert.equal(after.background,before.background,label+' hover changed own business fill');
            await page.screenshot({path:dir+'/'+label+'.png'});
            record.push({label,dy:after.y-before.y,computedY:parsed,rectBefore:before,rectAfter:after});
          }
          try {
            for(const c of [
              {id:'editable-1440',query:'?edit=1',width:1440,kind:'hover'},
              {id:'editable-390',query:'?edit=1',width:390,kind:'hover'},
              {id:'popup-mixed',query:'?popup=1&popup-mixed=1',width:1440,kind:'popup'},
              {id:'guest',query:'?guest=1',width:900,kind:'guest'},
              {id:'full-preview',query:'?full=1&preview-role=admin',width:1440,kind:'full'}
            ]){
              const ctx=await browser.newContext({viewport:{width:c.width,height:c.width===390?844:900}});
              const page=await ctx.newPage();
              await page.route('**/*',route=>{
                const u=new URL(route.request().url());
                if(u.origin===new URL(base).origin)return route.continue();
                external.push(u.href);return route.abort();
              });
              await page.goto(base+c.query,{waitUntil:'networkidle',timeout:40000});
              if(c.kind==='hover') {
                await page.locator('[data-qa="compact-real-itemlist"]').waitFor();
                await verifyLayout(page,'.item-data-table',c.id,'editable');
                await checkLift(page,'.item-data-table',c.id);
              } else if(c.kind==='popup'){
                await page.getByRole('button',{name:'Chỉnh sửa nháp'}).waitFor();
                await page.getByRole('button',{name:'Chỉnh sửa nháp'}).click();
                await page.getByRole('button',{name:'Về chế độ xem'}).waitFor();
                await verifyLayout(page,'.report-detail-grid',c.id,'popup');
                await checkLift(page,'.report-detail-grid',c.id);
              } else if(c.kind==='guest'){
                await page.locator('[data-qa="compact-real-itemlist"]').waitFor();
                assert.equal(await page.locator('.item-data-table .compact-stages button.cell-picker-trigger').count(),0,'guest fake editor');
                await verifyLayout(page,'.item-data-table',c.id,'readonly');
                await page.screenshot({path:dir+'/guest.png'});
                record.push({label:c.id,readonly:true});
              } else {
                await page.locator('[data-preview="pr95-l4-full"]').waitFor({timeout:25000});
                // The actual published administrator width editor must offer
                // the five smaller minima, not just have new source constants.
                const editor=page.locator('button[aria-controls="admin-l03-width-editor"]');
                await editor.waitFor({timeout:25000});
                await editor.click();
                const minLimits=await page.locator('#admin-l03-width-editor input').evaluateAll(nodes=>
                  nodes.map(input=>({label:input.getAttribute('aria-label'),
                    min:Number(input.min),max:Number(input.max)})));
                assert.deepEqual(minLimits.map(x=>x.min),[64,72,64,48,72],
                  'Published L03 editor still enforces outdated five-rail minima');
                await page.screenshot({path:dir+'/full-preview.png'});
                record.push({label:c.id,fullSynthetic:true,minLimits});
              }
              await ctx.close();
            }
            assert.deepEqual(external,[],'Live site made external network requests');
            writeFileSync(dir+'/public-measurements.json',JSON.stringify({sourceSha:'b11f18adb41ff0eb12219377fa6d2e8c174ff07f',url:base,record,external},null,2));
            console.log('L03_PUBLIC_REAL_BROWSER_HOVER_3PX_AND_QA_ROLES_PASS',JSON.stringify(record));
          } finally {await browser.close();}
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: l03-public-preview-verified-live
          path: source/qa-results/l03-live-public/**
          retention-days: 14
          if-no-files-found: warn
