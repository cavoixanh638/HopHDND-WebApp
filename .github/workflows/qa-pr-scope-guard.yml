name: HĐND PR scope policy contract (NO DEPLOY)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/scripts/ci-pr-scope.mjs'
      - '.github/scripts/ci-pr-scope.test.mjs'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify PR scope contract without installing dependencies
        run: node --test .github/scripts/ci-pr-scope.test.mjs