name: UI 20261104 Worker B — real App admin controls E2E (Emulator only)
on:
  push:
    branches:
      - ui/20261104-admin-controls
    paths:
      - 'source/src/features/items/ItemList.tsx'
      - 'source/src/features/items/admin-list-controls.css'
      - 'source/scripts/ui-20261104-b-admin-controls-e2e.mjs'
      - '.github/workflows/ui-20261104-b-admin-e2e.yml'
  pull_request:
    paths:
      - 'source/src/features/items/ItemList.tsx'
      - 'source/src/features/items/admin-list-controls.css'
      - 'source/scripts/ui-20261104-b-admin-controls-e2e.mjs'
      - '.github/workflows/ui-20261104-b-admin-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-app-admin-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 26
    defaults:
      run:
        working-directory: source
    env:
      CI: 'true'
      GCLOUD_PROJECT: demo-hdnd
      VITE_PARENT_REPLACEMENT_ENABLED: 'true'
      VITE_PARENT_COMMIT_ENDPOINT: http://127.0.0.1:5001/demo-hdnd/us-central1/parentDatasetCommit
      B_TEST_CODE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact SHA and runner isolation
        run: |
          test "$(git rev-parse HEAD)" = "$B_TEST_CODE_SHA"
          test "$GCLOUD_PROJECT" = "demo-hdnd"
          node --check scripts/ui-20261104-b-admin-controls-e2e.mjs
      - name: Install exact dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix cell-edit-service --no-audit --no-fund
          npm ci --prefix parent-commit-service --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Build real pages-test App (no deploy)
        run: npm run build:pages:test
      - name: Real Chrome App + exact Auth/RTDB/Functions Emulator admin controls
        run: node scripts/ui-20261104-b-admin-controls-e2e.mjs
      - name: Preserve B mouse/key, admin/guest, 1440/900/390, conflict/denied PNG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-20261104-b-admin-controls-${{ github.run_id }}
          path: source/ui-b-admin-artifacts/*.png
          if-no-files-found: warn
          retention-days: 21
