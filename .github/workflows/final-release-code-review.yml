name: FINAL-RELEASE-CODE-REVIEW pinpoint historical V2 rights (NO DEPLOY)
on:
  push:
    branches:
      - review/pr147-final-release-code-02964722-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independently-reproduce-alternate-history-write:
    runs-on: ubuntu-latest
    timeout-minutes: 27
    steps:
      - uses: actions/checkout@v4
        with:
          path: reviewer
          persist-credentials: false
      - name: Exact immutable PR147 candidate in separate checkout
        uses: actions/checkout@v4
        with:
          ref: 02964722ae405a7ccf70f2b88bfe21cb7d0bcca7
          path: target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install original app and both real Functions
        working-directory: target/source
        run: |
          test "$(git rev-parse HEAD)" = "02964722ae405a7ccf70f2b88bfe21cb7d0bcca7"
          npm ci --no-audit --no-fund
          npm install --prefix cell-edit-service --no-package-lock --ignore-scripts --no-audit --no-fund
          npm install --prefix parent-commit-service --no-package-lock --ignore-scripts --no-audit --no-fund
      - name: Generate independent test-only isolated file, keep original candidate untouched
        working-directory: target/source
        run: |
          node ../../reviewer/source/release-review/prepare-historical-rights.mjs
          test -s parent-commit-service/test/final-release-review.generated.test.ts
          test -s parent-commit-service/test/final-release-review-run.generated.mjs
          mkdir -p parent-commit-service/evidence
      - name: One focused real signed-in admin, live parent HTTP, FULL Rules reproduction
        working-directory: target/source
        shell: bash
        env:
          PARENT_COMMIT_ENABLED: 'true'
          PARENT_DATABASE_URL: https://demo-hdnd.firebaseio.com
          PARENT_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-hdnd --only auth,database,functions \
            --config firebase.staging.json \
            "node parent-commit-service/test/final-release-review-run.generated.mjs" 2>&1 \
            | tee parent-commit-service/evidence/final-release-code-review.stdout.log
      - name: Preserve server before/after witness and test-only source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-release-code-review-historical-rights-${{ github.run_id }}
          path: |
            target/source/parent-commit-service/evidence/**
            target/source/parent-commit-service/test/final-release-review.generated.test.ts
            target/source/parent-commit-service/test/final-release-review-run.generated.mjs
          if-no-files-found: warn
          retention-days: 30
