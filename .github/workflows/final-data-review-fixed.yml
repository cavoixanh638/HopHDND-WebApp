name: FINAL-DATA-REVIEW post-fix historical lease + forged restore (exact PR147 SHA)
on:
  push:
    branches:
      - review/pr142-final-data-crosscheck-20261101
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-fixed-pr147:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
        with: {path: reviewer, persist-credentials: false}
      - uses: actions/checkout@v4
        with:
          ref: 6f27378a8231a9bc43e30e659d2162d2a1e030c6
          path: candidate-target
          persist-credentials: false
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Install exact candidate runtimes and create test-only synchronized race copies
        working-directory: candidate-target/source
        run: |
          test "$(git rev-parse HEAD)" = "6f27378a8231a9bc43e30e659d2162d2a1e030c6"
          npm ci
          npm install --prefix parent-commit-service --no-package-lock --ignore-scripts
          npm install --prefix cell-edit-service --no-package-lock --ignore-scripts
          node ../../reviewer/source/data-review/prepare-candidate-races.mjs
          node ../../reviewer/source/data-review/prepare-fixed-regression.mjs
          mkdir -p parent-commit-service/evidence
      - name: Run exact PR147 FULL Rules and both authenticated services with fixed invariants
        working-directory: candidate-target/source
        shell: bash
        env:
          PARENT_COMMIT_ENABLED: 'true'
          PARENT_DATABASE_URL: https://demo-hdnd.firebaseio.com
          PARENT_ALLOWED_ORIGINS: http://127.0.0.1:4173,http://127.0.0.1:4174
        run: |
          set -o pipefail
          npx firebase emulators:exec --project demo-hdnd --only auth,database,functions \
            --config firebase.staging.json \
            "node parent-commit-service/test/final-data-fixed-run.generated.mjs" 2>&1 \
            | tee parent-commit-service/evidence/final-data-fixed.stdout.log
      - name: Independently preserve fresh signed-in before/after witness and full test-only code
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-data-review-verified-fixes-${{ github.run_id }}
          path: |
            candidate-target/source/parent-commit-service/evidence/**
            candidate-target/source/parent-commit-service/test/final-data-fixed.generated.test.ts
          if-no-files-found: warn
          retention-days: 30
