name: Audit dual-backend integration (read only)
on:
  push:
    branches:
      - integration/firebase-supabase-unified-20261026
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  simulated-combined-source-qa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Assemble exact Firebase+Supabase source in ephemeral runner
        working-directory: .
        env:
          SUPABASE_SHA: afb10fe2e5371a81a54fa736ecac403bb7fe57b2
        run: |
          set -euo pipefail
          git config user.name "HopHDND Integration Build (no deploy)"
          git config user.email "integration@users.noreply.github.com"
          # Test the exact immutable source pair independent of newly edited docs
          # on this coordinator branch; do not silently drift to moving PR heads.
          git switch --detach 259c36acaa3d35367459204fda81a58bff7abc32
          git merge --no-commit --no-ff "$SUPABASE_SHA"
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            echo "::error::Combined source has unresolved conflicts"
            exit 1
          fi
      - name: Install pinned combined dependencies (local only)
        run: npm ci
      - name: Combined TypeScript + browser build
        run: npm run build:pages:test
      - name: Both source unit and security contract suites
        run: npm test
      - name: Firebase Auth and Database Emulator regressions
        run: npm run test:firebase
      - name: Preserve combined QA static bundle without publishing
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dual-backend-combined-qa-site
          path: source/dist-pages-test/
          if-no-files-found: error
          retention-days: 14
  replay-and-conflict-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Ensure exact source commits still exist
        env:
          FIREBASE_SHA: 259c36acaa3d35367459204fda81a58bff7abc32
          SUPABASE_SHA: afb10fe2e5371a81a54fa736ecac403bb7fe57b2
          FOUNDATION_SHA: 66553279791cddec0039c54a0da194a8ec24d1c0
        run: |
          set -euo pipefail
          for sha in "$FIREBASE_SHA" "$SUPABASE_SHA" "$FOUNDATION_SHA"; do
            git cat-file -e "$sha^{commit}" || {
              echo "::error::Missing source commit $sha (do not silently use moving branch heads)"
              exit 1
            }
          done
          echo "Source commits verified without changing refs"
      - name: Offline three-way merge conflict audit (NEVER push or deploy)
        id: audit
        env:
          SUPABASE_SHA: afb10fe2e5371a81a54fa736ecac403bb7fe57b2
        run: |
          set -uo pipefail
          mkdir -p integration-evidence
          git config user.name "HopHDND Merge Audit (CI only)"
          git config user.email "merge-audit@users.noreply.github.com"
          baseline="$(git rev-parse HEAD)"
          echo "Base HEAD: $baseline"
          echo "Target Supabase HEAD: $SUPABASE_SHA"
          set +e
          git merge --no-commit --no-ff "$SUPABASE_SHA" > integration-evidence/merge-output.txt 2>&1
          merge_exit=$?
          set -e
          git diff --name-only --diff-filter=U > integration-evidence/unresolved.txt
          git diff --name-status --cached > integration-evidence/staged.txt
          {
            echo "# HopHDND integration merge audit (NON-DESTRUCTIVE)"
            echo
            echo "Firebase-first integration branch HEAD: `$baseline`"
            echo
            echo "Supabase stacked PR #75 exact candidate: `$SUPABASE_SHA`"
            echo
            echo "Merge exit: $merge_exit (zero = no textual conflicts)"
            echo
            echo "Unresolved files: $(wc -l < integration-evidence/unresolved.txt)"
            echo
            echo "## Conflict files"
            sed 's/^/- /' integration-evidence/unresolved.txt
            echo
            echo "## Automated merged paths"
            sed 's/^/- /' integration-evidence/staged.txt
            echo
            echo "**NOTICE:** A textually conflict-free merge still requires security and runtime contract review. This CI action never pushes, deploys, imports or changes databases."
          } > integration-evidence/report.md
          cat integration-evidence/report.md
          echo "conflicts=$(wc -l < integration-evidence/unresolved.txt)" >> "$GITHUB_OUTPUT"
          echo "merge_exit=$merge_exit" >> "$GITHUB_OUTPUT"
          echo "### Integration audit" >> "$GITHUB_STEP_SUMMARY"
          cat integration-evidence/report.md >> "$GITHUB_STEP_SUMMARY"
          # Do not leave a merge in progress; no changes leave runner.
          git merge --abort || git reset --hard "$baseline"
      - name: Upload reproducible conflict and staged-file evidence
        uses: actions/upload-artifact@v4
        with:
          name: dual-backend-merge-audit
          path: integration-evidence/
          retention-days: 30
          if-no-files-found: error
      - name: Block release if the two branches still conflict
        if: steps.audit.outputs.conflicts != '0' || steps.audit.outputs.merge_exit != '0'
        run: |
          echo "::error::Firebase/Supabase merge has unresolved conflicts. Resolve per file, then rerun tests. NO-GO."
          exit 1

  publish-verified-merge-to-integration-only:
    # ONLY the trusted owner's own Draft integration PR and ONLY after BOTH
    # immutable source security/compile tests pass. NEVER update main/prod.
    needs: [replay-and-conflict-audit, simulated-combined-source-qa]
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'integration/firebase-supabase-unified-20261026'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/firebase-supabase-unified-20261026
          fetch-depth: 0
          persist-credentials: true
      - name: Fast-forward protected merge into integration branch only
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          SUPABASE_SHA: afb10fe2e5371a81a54fa736ecac403bb7fe57b2
          TARGET_BRANCH: integration/firebase-supabase-unified-20261026
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$EXPECTED_HEAD" ]; then
            echo "::error::Integration head changed during QA; refuse to merge stale result"
            exit 1
          fi
          if git merge-base --is-ancestor "$SUPABASE_SHA" HEAD; then
            echo "Supabase input is already an ancestor; no duplicate merge needed"
            exit 0
          fi
          git config user.name "HopHDND Integration CI"
          git config user.email "integration@users.noreply.github.com"
          git merge --no-ff -m "merge(integration): retain full PR #75/#73 history on Firebase #72 base [skip ci]" "$SUPABASE_SHA"
          # Refuse anything except a regular fast-forward push to THIS draft branch.
          git push origin "HEAD:refs/heads/$TARGET_BRANCH"
          echo "Single integration merge commit created; main/production untouched"
