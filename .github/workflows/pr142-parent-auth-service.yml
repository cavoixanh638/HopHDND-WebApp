name: PR142 parent replacement authenticated service (isolated)
on:
  pull_request:
    paths:
      - "source/parent-commit-service/**"
      - "source/src/data/firebase-versioned-replacement*.ts"
      - "source/src/data/parent-commit-api.ts"
      - "source/src/features/settings/VersionedExcelReplacementPanel.tsx"
      - ".github/workflows/pr142-parent-auth-service.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parent-auth-service-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authenticated-parent-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: source
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install application deps
        run: npm ci
      - name: Install isolated service deps (without touching application lockfile)
        run: npm install --prefix parent-commit-service --no-package-lock --ignore-scripts
      - name: Check main application TypeScript
        run: npm run typecheck
      - name: Build one FULL candidate Rules trial copy
        run: node parent-commit-service/scripts/build-rules.mjs
      - name: Run actual Auth ID-token endpoint and FULL Rules Emulator integration
        shell: bash
        run: |
          set -o pipefail
          mkdir -p parent-commit-service/evidence
          npx firebase emulators:exec --project demo-hdnd --only database,auth \
            --config parent-commit-service/firebase.parent-commit-test.json \
            "node parent-commit-service/test/run.mjs" 2>&1 \
            | tee parent-commit-service/evidence/emulator.stdout.log
      - name: Archive local-only service endpoint and RTDB witnesses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr142-authenticated-parent-commit-${{ github.run_attempt }}
          path: |
            source/parent-commit-service/evidence/**
            source/parent-commit-service/.generated/rules-manifest.json
          if-no-files-found: warn
          retention-days: 30